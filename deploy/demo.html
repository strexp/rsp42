<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>rsp42 · management demo</title>
<style>
  :root {
    --bg: #f6f7fb; --panel: #ffffff; --panel-2: #fafbfe; --border: #e5e7ef;
    --text: #1b1f2a; --muted: #6b7280; --faint: #9aa1ad;
    --primary: #4f46e5; --primary-600: #4338ca; --primary-soft: #eef0ff;
    --green: #15803d; --green-soft: #e8f6ee; --amber: #b45309; --amber-soft: #fdf3e3;
    --red: #b91c1c; --red-soft: #fdecec; --blue: #1d4ed8; --blue-soft: #e9effd;
    --shadow: 0 1px 2px rgba(16,24,40,.04), 0 8px 24px rgba(16,24,40,.06);
    --radius: 12px; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1117; --panel: #161b22; --panel-2: #1b212b; --border: #262d38;
      --text: #e6eaf2; --muted: #9aa4b2; --faint: #6b7480;
      --primary: #7c8cff; --primary-600: #6d7cff; --primary-soft: #1e2438;
      --green: #4ade80; --green-soft: #12261a; --amber: #fbbf24; --amber-soft: #2a2111;
      --red: #f87171; --red-soft: #2a1414; --blue: #7aa2ff; --blue-soft: #141c2e;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--primary); text-decoration: none; }
  code, .mono { font-family: var(--mono); font-size: 12.5px; }

  .topbar {
    position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 12px;
    padding: 10px 16px; background: color-mix(in oklab, var(--panel) 88%, transparent);
    backdrop-filter: blur(8px); border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: .2px; }
  .brand .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--primary); box-shadow: 0 0 0 4px var(--primary-soft); }
  .brand small { font-weight: 500; color: var(--muted); }
  .spacer { flex: 1; }
  .connect { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .input, select {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 10px; font: inherit; outline: none; min-width: 0;
  }
  .input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
  .input.url { width: min(46vw, 420px); font-family: var(--mono); font-size: 12px; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); padding: 8px 12px; border-radius: 10px;
    font: inherit; cursor: pointer; transition: .15s ease; white-space: nowrap;
  }
  .btn:hover { border-color: color-mix(in oklab, var(--primary) 40%, var(--border)); transform: translateY(-1px); }
  .btn:active { transform: none; }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn.primary:hover { background: var(--primary-600); }
  .btn.ghost { background: transparent; }
  .btn.danger { color: var(--red); border-color: color-mix(in oklab, var(--red) 35%, var(--border)); }
  .btn.sm { padding: 5px 9px; border-radius: 8px; font-size: 12.5px; }
  .btn[disabled] { opacity: .5; cursor: not-allowed; transform: none; }

  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 12px; border: 1px solid var(--border); color: var(--muted); }
  .pill.ok { color: var(--green); background: var(--green-soft); border-color: transparent; }
  .pill.bad { color: var(--red); background: var(--red-soft); border-color: transparent; }
  .pill.warn { color: var(--amber); background: var(--amber-soft); border-color: transparent; }
  .dotlive { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }

  .layout { display: grid; grid-template-columns: 226px 1fr; min-height: calc(100% - 57px); }
  .sidebar { padding: 16px 12px; border-right: 1px solid var(--border); position: sticky; top: 57px; align-self: start; height: calc(100vh - 57px); overflow: auto; }
  .nav { display: flex; flex-direction: column; gap: 4px; }
  .nav button {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    padding: 9px 11px; border-radius: 10px; border: 1px solid transparent; background: transparent;
    color: var(--text); font: inherit; cursor: pointer;
  }
  .nav button:hover { background: var(--panel-2); }
  .nav button.active { background: var(--primary-soft); border-color: color-mix(in oklab, var(--primary) 25%, transparent); color: var(--primary); font-weight: 600; }
  .nav .ico { width: 18px; text-align: center; }
  .sidebar .hint { margin: 14px 6px 0; color: var(--faint); font-size: 11.5px; line-height: 1.5; }

  main { padding: 20px 22px 60px; max-width: 1240px; }
  .page-head { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .page-head h1 { font-size: 20px; margin: 0; }
  .page-head p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 0 0 12px; }
  .toolbar .grow { flex: 1; }

  .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
  .card .pad { padding: 14px 16px; }
  .grid { display: grid; gap: 14px; }
  .grid.cols { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }

  table { width: 100%; border-collapse: collapse; }
  thead th {
    text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em;
    color: var(--faint); font-weight: 600; padding: 10px 14px; border-bottom: 1px solid var(--border);
    position: sticky; top: 0; background: var(--panel);
  }
  tbody td { padding: 10px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tbody tr:hover { background: var(--panel-2); }
  tbody tr:last-child td { border-bottom: none; }
  td .actions { display: flex; gap: 6px; justify-content: flex-end; }

  .badge { display: inline-flex; align-items: center; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600; background: var(--primary-soft); color: var(--primary); }
  .badge.installed { background: var(--green-soft); color: var(--green); }
  .badge.error, .badge.unavailable { background: var(--red-soft); color: var(--red); }
  .badge.downloaded, .badge.released { background: var(--blue-soft); color: var(--blue); }
  .badge.allocated, .badge.linked, .badge.confirmed { background: var(--amber-soft); color: var(--amber); }
  .badge.available { background: var(--green-soft); color: var(--green); }
  .badge.blocked { background: var(--red-soft); color: var(--red); }
  .badge.reserved { background: var(--amber-soft); color: var(--amber); }
  .badge.allocated-p { background: var(--blue-soft); color: var(--blue); }

  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); }
  .stat .k { color: var(--muted); font-size: 12px; }
  .stat .v { font-size: 24px; font-weight: 700; margin-top: 4px; }
  .stat .s { color: var(--faint); font-size: 11.5px; }

  .empty { padding: 40px 16px; text-align: center; color: var(--muted); }
  .empty .big { font-size: 30px; opacity: .5; }

  .pager { display: flex; align-items: center; gap: 10px; padding: 10px 14px; color: var(--muted); font-size: 12.5px; }

  .toasts { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 60; }
  .toast { background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--primary); border-radius: 10px; box-shadow: var(--shadow); padding: 10px 12px; max-width: 360px; animation: slidein .18s ease; }
  .toast.ok { border-left-color: var(--green); }
  .toast.err { border-left-color: var(--red); }
  .toast .t { font-weight: 600; }
  .toast .m { color: var(--muted); font-size: 12.5px; word-break: break-word; }
  @keyframes slidein { from { transform: translateY(6px); opacity: 0 } to { transform: none; opacity: 1 } }

  .overlay { position: fixed; inset: 0; background: rgba(10,12,18,.44); display: none; z-index: 40; }
  .overlay.show { display: block; }
  .modal { position: fixed; z-index: 50; top: 8vh; left: 50%; transform: translateX(-50%); width: min(680px, 94vw); max-height: 84vh; overflow: auto; display: none; }
  .modal.show { display: block; }
  .modal .head, .drawer .head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .modal .head h3, .drawer .head h3 { margin: 0; font-size: 15px; flex: 1; }
  .modal .body { padding: 16px; }
  .modal .foot { display: flex; gap: 8px; justify-content: flex-end; padding: 12px 16px; border-top: 1px solid var(--border); }
  .drawer { position: fixed; z-index: 50; top: 0; right: 0; height: 100%; width: min(560px, 96vw); background: var(--panel); border-left: 1px solid var(--border); box-shadow: var(--shadow); transform: translateX(102%); transition: transform .22s ease; overflow: auto; }
  .drawer.show { transform: none; }
  .drawer .body { padding: 16px; }

  .field { display: grid; gap: 5px; margin-bottom: 12px; }
  .field label { font-size: 12px; color: var(--muted); font-weight: 600; }
  .field .row { display: flex; gap: 8px; }
  .field .row > * { flex: 1; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  dl.kv { display: grid; grid-template-columns: 140px 1fr; gap: 6px 12px; margin: 0; }
  dl.kv dt { color: var(--muted); font-size: 12px; }
  dl.kv dd { margin: 0; font-family: var(--mono); font-size: 12.5px; word-break: break-all; }

  .timeline { list-style: none; margin: 0; padding: 0; }
  .timeline li { position: relative; padding: 8px 0 8px 20px; border-left: 1px dashed var(--border); margin-left: 6px; }
  .timeline li:before { content: ""; position: absolute; left: -5px; top: 14px; width: 9px; height: 9px; border-radius: 50%; background: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
  .timeline .when { color: var(--faint); font-size: 11.5px; }
  .timeline .what { font-weight: 600; }

  .banner { display: none; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 10px; margin-bottom: 12px; }
  .banner.show { display: flex; }
  .banner.warn { background: var(--amber-soft); color: var(--amber); }
  .banner.err { background: var(--red-soft); color: var(--red); }

  .spin { width: 15px; height: 15px; border: 2px solid color-mix(in oklab, var(--primary) 30%, transparent); border-top-color: var(--primary); border-radius: 50%; animation: rot .7s linear infinite; display: inline-block; }
  @keyframes rot { to { transform: rotate(360deg) } }
  .loading { padding: 26px; text-align: center; color: var(--muted); }

  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
    .sidebar { position: static; height: auto; border-right: none; border-bottom: 1px solid var(--border); }
    .nav { flex-direction: row; flex-wrap: wrap; }
    .nav button { width: auto; }
    .two { grid-template-columns: 1fr; }
    .input.url { width: 100%; }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="dot"></span>rsp42 <small>· management demo</small></div>
  <div class="spacer"></div>
  <div class="connect">
    <input id="base" class="input url" spellcheck="false" placeholder="http://127.0.0.1:9000/admin/api/v1" />
    <select id="mode" title="Data source">
      <option value="api">Live API</option>
      <option value="demo">Demo data</option>
    </select>
    <button id="connectBtn" class="btn primary">Connect</button>
    <span id="status" class="pill"><span class="dotlive"></span><span id="statusText">idle</span></span>
  </div>
</header>

<div class="overlay" id="overlay"></div>

<div class="layout">
  <aside class="sidebar">
    <nav class="nav" id="nav"></nav>
    <div class="hint">
      BSS/OSS-facing management API. No authentication — deploy on a trusted network.
      <div style="margin-top:8px">Client: <span id="clientKind" class="mono">–</span></div>
    </div>
  </aside>
  <main>
    <div id="banner" class="banner warn"></div>
    <div id="view"></div>
  </main>
</div>

<div class="toasts" id="toasts"></div>
<div class="modal card" id="modal"></div>
<aside class="drawer" id="drawer"></aside>

<script type="module">
// ------------------------------------------------------------------ helpers
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const fmtTime = (t) => { if (!t) return '–'; const d = new Date(t); return isNaN(d) ? esc(t) : d.toLocaleString(); };
const short = (s, n = 16) => { s = String(s ?? ''); return s.length > n ? s.slice(0, n) + '…' : s; };

function toast(title, msg = '', kind = '') {
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.innerHTML = `<div class="t">${esc(title)}</div>${msg ? `<div class="m">${esc(msg)}</div>` : ''}`;
  $('#toasts').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 320); }, 4200);
}

function badge(text) {
  const cls = String(text).toLowerCase().replace(/[^a-z]/g, '');
  return `<span class="badge ${cls}">${esc(text)}</span>`;
}
function loading() { return `<div class="loading"><span class="spin"></span> loading…</div>`; }
function empty(msg, icon = '∅') { return `<div class="empty"><div class="big">${icon}</div><div>${esc(msg)}</div></div>`; }
function pager(state, onGo) {
  const pages = Math.max(1, Math.ceil(state.total / state.size));
  return `<div class="pager">
    <button class="btn sm" ${state.page <= 1 ? 'disabled' : ''} data-pager="prev">‹ Prev</button>
    <span>page ${state.page} / ${pages} · ${state.total} total</span>
    <button class="btn sm" ${state.page >= pages ? 'disabled' : ''} data-pager="next">Next ›</button>
  </div>`;
}

// ------------------------------------------------------------------ spec (for openapi-client-axios)
const SPEC_PATHS = {
  '/profiles': ['get', 'post'],
  '/profiles/{iccid}': ['get', 'patch', 'delete'],
  '/profiles/{iccid}/confirm': ['post'],
  '/profiles/{iccid}/cancel': ['post'],
  '/profiles/{iccid}/release': ['post'],
  '/profiles/{iccid}/activation-code': ['post'],
  '/profiles/{iccid}/timeline': ['get'],
  '/profiles/bulk': ['post'],
  '/profiles/export': ['get'],
  '/profiles/import': ['post'],
  '/batches': ['get', 'post'],
  '/batches/{id}': ['get', 'delete'],
  '/batches/{id}/items': ['get'],
  '/batches/{id}/confirm': ['post'],
  '/batches/{id}/cancel': ['post'],
  '/upp': ['get', 'post'],
  '/upp/{name}': ['get', 'delete'],
  '/upp/{name}/decoded': ['get'],
  '/upp/{name}/activate': ['post'],
  '/upp/{name}/deactivate': ['post'],
  '/personalization': ['get'],
  '/personalization/{iccid}': ['get', 'put', 'delete'],
  '/personalization/import': ['post'],
  '/personalization/export': ['get'],
  '/iccid-pool': ['get'],
  '/iccid-pool/stats': ['get'],
  '/iccid-pool/reserve': ['post'],
  '/iccid-pool/release': ['post'],
  '/iccid-pool/block': ['post'],
  '/iccid-ranges': ['get', 'post'],
  '/iccid-ranges/{id}': ['delete'],
  '/audit': ['get'],
};
function buildSpec(base) {
  const paths = {};
  for (const [p, methods] of Object.entries(SPEC_PATHS)) {
    paths[p] = {};
    for (const m of methods) paths[p][m] = { responses: { 200: { description: 'ok' } } };
  }
  return { openapi: '3.0.3', info: { title: 'rsp42 management API', version: '0.1.0' }, servers: [{ url: base }], paths };
}

// ------------------------------------------------------------------ clients
function rspClient(transport) {
  return {
    get: (p, cfg) => transport.request('GET', p, null, cfg && cfg.params),
    post: (p, b) => transport.request('POST', p, b),
    put: (p, b) => transport.request('PUT', p, b),
    patch: (p, b) => transport.request('PATCH', p, b),
    delete: (p) => transport.request('DELETE', p),
  };
}

// fetch-based transport
function makeFetchTransport(base) {
  async function request(method, path, body, params) {
    const url = new URL(base.replace(/\/$/, '') + path);
    if (params) for (const [k, v] of Object.entries(params)) if (v !== undefined && v !== null && v !== '') url.searchParams.set(k, v);
    let res;
    try {
      res = await fetch(url, { method, headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined });
    } catch (e) { const err = new Error('network error (CORS?): ' + e.message); err.network = true; throw err; }
    const text = await res.text();
    let data = null; try { data = text ? JSON.parse(text) : null; } catch { data = text; }
    if (!res.ok) throw new Error((data && data.error) || `${res.status} ${res.statusText}`);
    return { data, status: res.status };
  }
  return { request };
}

async function makeOpenAPI(base) {
  const mod = await import('https://esm.sh/openapi-client-axios@7');
  const OpenAPIClientAxios = mod.default || mod.OpenAPIClientAxios || mod;
  const api = new OpenAPIClientAxios({ definition: buildSpec(base), axiosConfig: { baseURL: base } });
  await api.init();
  const ax = api.getClient();
  const transport = { request: (m, p, b, params) => ax.request({ method: m, url: p, data: b, params }).then(r => ({ data: r.data, status: r.status })) };
  return transport;
}

// ------------------------------------------------------------------ demo (offline) transport
function makeDemoTransport() {
  const now = () => new Date().toISOString();
  let seq = 100;
  const profiles = [
    { iccid: '89000123456789012341', imsi: '001010123456063', profileType: 'operational', eid: '', state: 'Installed', matchingId: 'M-A1', ccRequired: false, downloadAttempts: 1, ccAttempts: 0, createdAt: now(), updatedAt: now(), installedAt: now() },
    { iccid: '89000123456789012342', imsi: '001010123456064', profileType: 'operational', eid: '', state: 'Released', matchingId: 'M-A2', ccRequired: true, downloadAttempts: 0, ccAttempts: 0, createdAt: now(), updatedAt: now() },
    { iccid: '89000123456789012343', imsi: '001010123456065', profileType: 'test', eid: '89049032123451234512345678901235', state: 'Allocated', matchingId: '', ccRequired: false, downloadAttempts: 0, ccAttempts: 0, createdAt: now(), updatedAt: now() },
  ];
  const batches = [{ id: 1, name: 'Q4 rollout', profileType: 'operational', state: 'Open', total: 2, createdAt: now(), updatedAt: now() }];
  const upp = [
    { name: 'TS48v1_A.der', saipMajor: 2, saipMinor: 1, active: true, sha256: 'dea14ec7a909…', size: 31000 },
    { name: 'TS48v2_SAIP2.3_BERTLV.der', saipMajor: 2, saipMinor: 3, active: true, sha256: '43af15322855…', size: 42000 },
  ];
  const perso = [{ iccid: '89000123456789012341', imsi: '001010123456063', hasK: true, hasOPc: true, algorithm: 'milenage' }];
  const pool = [{ iccid: '8900012000000000009', state: 'available', createdAt: now() }, { iccid: '8900012000000000014', state: 'allocated', eid: '89049032123451234512345678901235', createdAt: now() }];
  const ranges = [{ id: 1, start: '8900012000000000000', end: '8900012000000000099', createdAt: now() }];
  const audit = [{ time: now(), interface: 'admin', function: 'createProfile', subject: '89000123456789012341', outcome: 'Executed-Success', remoteAddr: '127.0.0.1:5555' }];

  const page = (items, params) => {
    const p = +(params?.page || 1), s = +(params?.size || 20);
    return { items: items.slice((p - 1) * s, (p - 1) * s + s), page: p, size: s, total: items.length };
  };
  const find = (arr, key, val) => arr.find(x => String(x[key]) === String(val));

  async function request(method, path, body, params) {
    await new Promise(r => setTimeout(r, 120));
    const seg = path.split('/').filter(Boolean);
    // profiles
    if (seg[0] === 'profiles') {
      if (seg.length === 1) {
        if (method === 'GET') return { data: page(profiles, params), status: 200 };
        if (method === 'POST') { const p = { iccid: '8900012999' + String(++seq).padStart(10, '0'), imsi: '00101', profileType: body?.profileType || 'operational', eid: body?.eid || '', state: 'Allocated', matchingId: body?.matchingId || '', ccRequired: false, downloadAttempts: 0, ccAttempts: 0, createdAt: now(), updatedAt: now() }; profiles.unshift(p); return { data: p, status: 201 }; }
      }
      if (seg[1] === 'bulk') { return { data: { action: body.action, results: (body.iccids || []).map(i => ({ iccid: i, ok: true })) }, status: 200 }; }
      if (seg[1] === 'export') { return { data: { items: profiles, total: profiles.length }, status: 200 }; }
      if (seg[1] === 'import') { return { data: { imported: (body.records || []).length }, status: 200 }; }
      const p = find(profiles, 'iccid', seg[1]);
      if (!p) throw new Error('unknown ICCID');
      const sub = seg[2];
      if (!sub) {
        if (method === 'GET') return { data: p, status: 200 };
        if (method === 'PATCH') { Object.assign(p, body); p.updatedAt = now(); return { data: p, status: 200 }; }
        if (method === 'DELETE') { profiles.splice(profiles.indexOf(p), 1); return { data: null, status: 204 }; }
      }
      if (sub === 'confirm') { p.state = body?.release ? 'Released' : 'Confirmed'; if (body?.matchingId) p.matchingId = body.matchingId; return { data: p, status: 200 }; }
      if (sub === 'cancel') { p.state = body?.finalStatus === 'Unavailable' ? 'Unavailable' : 'Available'; return { data: p, status: 200 }; }
      if (sub === 'release') { p.state = 'Released'; return { data: p, status: 200 }; }
      if (sub === 'activation-code') { return { data: { activationCode: `1$testsmdpplus1.example.com$${p.matchingId}`, matchingId: p.matchingId }, status: 200 }; }
      if (sub === 'timeline') { return { data: { iccid: p.iccid, events: [{ time: now(), kind: 'order', action: 'downloadOrder', detail: p.matchingId }, { time: now(), kind: 'notification', action: 'install', signed: true, success: true }] }, status: 200 }; }
    }
    // batches
    if (seg[0] === 'batches') {
      if (seg.length === 1) {
        if (method === 'GET') return { data: page(batches, params), status: 200 };
        if (method === 'POST') { const b = { id: batches.length + 1, name: body.name, profileType: body.profileType, state: 'Open', total: body.count, createdAt: now(), updatedAt: now() }; batches.unshift(b); return { data: b, status: 201 }; }
      }
      const b = find(batches, 'id', seg[1]);
      if (!b) throw new Error('unknown batch');
      if (!seg[2]) { if (method === 'GET') return { data: { batch: b, states: { Allocated: b.total } }, status: 200 }; if (method === 'DELETE') { batches.splice(batches.indexOf(b), 1); return { data: null, status: 204 }; } }
      if (seg[2] === 'items') return { data: page(profiles.slice(0, b.total), params), status: 200 };
      if (seg[2] === 'confirm') { b.state = 'Completed'; return { data: { applied: b.total, failed: 0 }, status: 200 }; }
      if (seg[2] === 'cancel') { b.state = 'Cancelled'; return { data: { applied: b.total, failed: 0 }, status: 200 }; }
    }
    // upp
    if (seg[0] === 'upp') {
      if (seg.length === 1) { if (method === 'GET') return { data: { items: upp }, status: 200 }; if (method === 'POST') { const u = { name: body.name, saipMajor: 2, saipMinor: 1, active: true, sha256: 'demo…', size: 1234 }; upp.unshift(u); return { data: u, status: 200 }; } }
      const u = find(upp, 'name', seg[1]);
      if (!u) throw new Error('unknown template');
      if (seg[2] === 'decoded') return { data: { name: u.name, major: u.saipMajor, minor: u.saipMinor, profileType: 'GSMA Generic eUICC Test Profile', iccid: '89000123456789012341', services: ['usim', 'isim', 'javacard'], gfste: ['2.23.143.1.2.1', '2.23.143.1.2.3'], elements: [{ tag: 'A0', name: 'header', size: 137 }, { tag: 'B0', name: 'mf', size: 761 }], files: [{ fid: '2FE2', peName: 'mf', bodySize: 10 }] }, status: 200 };
      if (seg[2] === 'activate') { u.active = true; return { data: u, status: 200 }; }
      if (seg[2] === 'deactivate') { u.active = false; return { data: u, status: 200 }; }
      if (!seg[2] && method === 'DELETE') { upp.splice(upp.indexOf(u), 1); return { data: null, status: 204 }; }
    }
    // personalization
    if (seg[0] === 'personalization') {
      if (seg.length === 1 && method === 'GET') return { data: page(perso, params), status: 200 };
      if (seg[1] === 'export') return { data: { items: perso, total: perso.length }, status: 200 };
      if (seg[1] === 'import') { return { data: { imported: (body.records || []).length }, status: 200 }; }
      const key = seg[1];
      const rec = find(perso, 'iccid', key);
      if (method === 'GET') { if (!rec) throw new Error('no personalization'); return { data: rec, status: 200 }; }
      if (method === 'PUT') { const r = { iccid: key, imsi: body.imsi, hasK: !!body.k, hasOPc: !!body.opc, algorithm: body.algorithm, k: body.k, opc: body.opc }; const i = perso.findIndex(x => x.iccid === key); if (i >= 0) perso[i] = r; else perso.unshift(r); return { data: r, status: 200 }; }
      if (method === 'DELETE') { const i = perso.findIndex(x => x.iccid === key); if (i < 0) throw new Error('not found'); perso.splice(i, 1); return { data: null, status: 204 }; }
    }
    // iccid pool
    if (seg[0] === 'iccid-pool') {
      if (seg[1] === 'stats') { const c = {}; pool.forEach(x => c[x.state] = (c[x.state] || 0) + 1); return { data: { states: c, ranges: ranges.length, available: c.available || 0 }, status: 200 }; }
      if (seg[1] === 'reserve') { const e = pool.find(x => x.state === 'available'); if (!e) throw new Error('no available ICCID'); e.state = 'allocated'; e.eid = body.eid; return { data: { iccid: e.iccid, state: 'allocated' }, status: 200 }; }
      if (seg[1] === 'release' || seg[1] === 'block') { const e = find(pool, 'iccid', body.iccid); if (!e) throw new Error('unknown ICCID'); e.state = seg[1] === 'release' ? 'available' : 'blocked'; return { data: e, status: 200 }; }
      if (method === 'GET') return { data: page(pool.filter(x => !params?.state || x.state === params.state), params), status: 200 };
    }
    if (seg[0] === 'iccid-ranges') {
      if (method === 'GET') return { data: { items: ranges }, status: 200 };
      if (method === 'POST') { const r = { id: ranges.length + 1, start: body.start, end: body.end, note: body.note, createdAt: now() }; ranges.push(r); return { data: { rangeId: r.id, inserted: 10, skipped: 90 }, status: 201 }; }
      if (method === 'DELETE') { ranges.splice(ranges.findIndex(x => String(x.id) === seg[1]), 1); return { data: { removed: 10 }, status: 200 }; }
    }
    if (seg[0] === 'audit' && method === 'GET') {
      const items = audit.filter(a => (!params?.interface || a.interface === params.interface) && (!params?.subject || a.subject === params.subject));
      return { data: page(items, params), status: 200 };
    }
    throw new Error(`demo: ${method} ${path} not implemented`);
  }
  return { request };
}

const SECTIONS = [

async function api(method, path, body, params) {
  if (!S.client) throw new Error('not connected');
  const res = await S.client[method.toLowerCase()](path, method === 'GET' ? { params } : body);
  return res.data;
}

// ------------------------------------------------------------------ shell
function renderNav() {
  $('#nav').innerHTML = SECTIONS.map(s =>
    `<button data-section="${s.id}" class="${S.section === s.id ? 'active' : ''}"><span class="ico">${s.icon}</span>${s.label}</button>`).join('');
}
function setStatus(text, cls = '') {
  $('#status').className = 'pill ' + cls;
  $('#statusText').textContent = text;
}
function banner(msg, kind = 'warn') {
  const b = $('#banner');
  if (!msg) { b.className = 'banner'; return; }
  b.className = 'banner show ' + kind;
  b.innerHTML = `<span>⚠️</span><div>${msg}</div>`;
}

async function connect() {
  S.base = $('#base').value.trim() || S.base;
  S.mode = $('#mode').value;
  localStorage.setItem('rsp42.base', S.base);
  localStorage.setItem('rsp42.mode', S.mode);
  setStatus('connecting…');
  banner('');
  try {
    if (S.mode === 'demo') {
      const t = makeDemoTransport();
      S.client = rspClient(t); S.kind = 'demo data';
    } else {
      let t, kind;
      try { t = await makeOpenAPI(S.base); kind = 'openapi-client-axios'; }
      catch (e) { t = makeFetchTransport(S.base); kind = 'fetch fallback'; }
      S.client = rspClient(t); S.kind = kind;
    }
    // connectivity probe
    try { await api('GET', '/profiles', null, { size: 1 }); }
    catch (e) {
      if (S.mode === 'api' && (e.network || /Failed to fetch|CORS|network/i.test(e.message))) {
        throw new Error('the API did not answer (CORS or server not running). Serve this page from the same origin, or switch to Demo data.');
      }
      throw e;
    }
    S.connected = true;
    setStatus('connected · ' + S.kind, 'ok');
    $('#clientKind').textContent = S.kind;
    await refresh();
  } catch (e) {
    S.connected = false;
    setStatus('offline', 'bad');
    banner(esc(e.message) + ' — you can switch the data source to <b>Demo data</b> to explore the UI.', 'err');
    if (S.mode === 'demo') { render(); } else { render(); }
    toast('Connect failed', e.message, 'err');
  }
}

async function refresh() {
  switch (S.section) {
    case 'profiles': return loadProfiles();
    case 'batches': return loadBatches();
    case 'upp': return loadUPP();
    case 'perso': return loadPerso();
    case 'pool': return loadPool();
    case 'audit': return loadAudit();
  }
}

  const head = `<div class="page-head"><div><h1>Audit log</h1><p>Management edits and interface requests.</p></div></div>
    <div class="toolbar">
      <select data-input="audit-interface">${['', 'admin', 'es9p', 'es11', 'es2p'].map(x => `<option ${x === a.interface ? 'selected' : ''} value="${x}">${x || 'Any interface'}</option>`).join('')}</select>
      <input class="input" style="flex:1;min-width:160px" placeholder="subject (ICCID/EID)" value="${esc(a.subject)}" data-input="audit-subject" />
      <button class="btn" data-action="audit-reload">Reload</button>
    </div>`;
  if (a.loading && !a.items.length) return head + loading();
  if (!a.items.length) return head + `<div class="card">${empty('No audit entries.', '📜')}</div>`;
  const rows = a.items.map(x => `<tr>
    <td>${fmtTime(x.time)}</td><td>${esc(x.interface || '–')}</td><td><b>${esc(x.function || '–')}</b></td>
    <td class="mono">${esc(short(x.subject, 24) || '–')}</td><td>${x.outcome ? badge(x.outcome === 'Executed-Success' ? 'Installed' : 'Error') : '–'}</td>
    <td class="mono">${esc(x.remoteAddr || '')}</td></tr>`).join('');
  return head + `<div class="card"><table><thead><tr><th>Time</th><th>Interface</th><th>Function</th><th>Subject</th><th>Outcome</th><th>Remote</th></tr></thead><tbody>${rows}</tbody></table>${pager(a)}</div>`;
}

// ------------------------------------------------------------------ render
function render() {
  renderNav();
  const v = { profiles: viewProfiles, batches: viewBatches, upp: viewUPP, perso: viewPerso, pool: viewPool, audit: viewAudit }[S.section];
  $('#view').innerHTML = v ? v() : '';
}

// ------------------------------------------------------------------ modal / drawer
function showModal(title, bodyHtml, footHtml) {
  $('#modal').innerHTML = `<div class="head"><h3>${title}</h3><button class="btn sm ghost" data-action="modal-close">✕</button></div>
    <div class="body">${bodyHtml}</div><div class="foot">${footHtml}</div>`;
  $('#modal').classList.add('show'); $('#overlay').classList.add('show');
}
function closeModal() { $('#modal').classList.remove('show'); $('#overlay').classList.remove('show'); }
function showDrawer(title, bodyHtml) {
  $('#drawer').innerHTML = `<div class="head"><h3>${title}</h3><button class="btn sm ghost" data-action="drawer-close">✕</button></div><div class="body">${bodyHtml}</div>`;
  $('#drawer').classList.add('show'); $('#overlay').classList.add('show');
}
function closeDrawer() { $('#drawer').classList.remove('show'); $('#overlay').classList.remove('show'); }

// ------------------------------------------------------------------ actions
async function doAction(action, el) {
  const d = el.dataset;
  try {
    if (action === 'profiles-reload') return loadProfiles();
    if (action === 'batches-reload') return loadBatches();
    if (action === 'audit-reload') return loadAudit();
    if (action === 'profile-new') return modalNewProfile();
    if (action === 'profile-open') return openProfile(d.iccid);
    if (action === 'profile-confirm') { await api('POST', `/profiles/${encodeURIComponent(d.iccid)}/confirm`, { release: true }); toast('Confirmed', d.iccid, 'ok'); return loadProfiles(); }
    if (action === 'profile-release') { await api('POST', `/profiles/${encodeURIComponent(d.iccid)}/release`); toast('Released', d.iccid, 'ok'); return loadProfiles(); }
    if (action === 'profile-delete') { if (!confirm(`Delete ${d.iccid}?`)) return; await api('DELETE', `/profiles/${encodeURIComponent(d.iccid)}`); toast('Deleted', d.iccid, 'ok'); return loadProfiles(); }
    if (action === 'profile-ac') { const r = await api('POST', `/profiles/${encodeURIComponent(d.iccid)}/activation-code`); showModal('Activation code', `<dl class="kv"><dt>ICCID</dt><dd>${esc(d.iccid)}</dd><dt>Matching ID</dt><dd>${esc(r.matchingId)}</dd><dt>Activation code</dt><dd>${esc(r.activationCode)}</dd></dl>`, `<button class="btn primary" data-action="modal-close">Close</button>`); return; }
    if (action === 'batch-new') return modalNewBatch();
    if (action === 'batch-items') { const r = await api('GET', `/batches/${d.id}/items`, null, { size: 100 }); showModal(`Batch #${d.id} items`, itemsTable(r.items || []), `<button class="btn primary" data-action="modal-close">Close</button>`); return; }
    if (action === 'batch-confirm') { const r = await api('POST', `/batches/${d.id}/confirm`, { release: true }); toast('Batch confirmed', `applied ${r.applied}, failed ${r.failed}`, 'ok'); return loadBatches(); }
    if (action === 'batch-cancel') { const r = await api('POST', `/batches/${d.id}/cancel`, { finalStatus: 'Available' }); toast('Batch cancelled', `applied ${r.applied}`, 'ok'); return loadBatches(); }
    if (action === 'batch-delete') { if (!confirm(`Delete batch #${d.id}?`)) return; await api('DELETE', `/batches/${d.id}`); toast('Deleted', 'batch #' + d.id, 'ok'); return loadBatches(); }
    if (action === 'upp-upload') return modalUploadUPP();
    if (action === 'upp-decoded') { const r = await api('GET', `/upp/${encodeURIComponent(d.name)}/decoded`); showModal(`Decoded · ${esc(d.name)}`, decodedView(r), `<button class="btn primary" data-action="modal-close">Close</button>`); return; }
    if (action === 'upp-toggle') { await api('POST', `/upp/${encodeURIComponent(d.name)}/${d.on === '1' ? 'activate' : 'deactivate'}`); return loadUPP(); }
    if (action === 'upp-delete') { if (!confirm(`Delete template ${d.name}?`)) return; await api('DELETE', `/upp/${encodeURIComponent(d.name)}`); toast('Deleted', d.name, 'ok'); return loadUPP(); }
    if (action === 'perso-new') return modalPerso('');
    if (action === 'perso-edit') return modalPerso(d.iccid);
    if (action === 'perso-delete') { if (!confirm(`Delete personalization for ${d.iccid}?`)) return; await api('DELETE', `/personalization/${encodeURIComponent(d.iccid)}`); toast('Deleted', d.iccid, 'ok'); return loadPerso(); }
    if (action === 'range-new') return modalRange();
    if (action === 'range-delete') { if (!confirm(`Delete range #${d.id}?`)) return; await api('DELETE', `/iccid-ranges/${d.id}`); toast('Range deleted', '#' + d.id, 'ok'); return loadPool(); }
    if (action === 'pool-reserve') { const r = await api('POST', '/iccid-pool/reserve', { eid: '' }); toast('Reserved', r.iccid, 'ok'); return loadPool(); }
    if (action === 'pool-release') { await api('POST', '/iccid-pool/release', { iccid: d.iccid }); return loadPool(); }
    if (action === 'pool-block') { await api('POST', '/iccid-pool/block', { iccid: d.iccid }); return loadPool(); }
    if (action === 'modal-close') return closeModal();
    if (action === 'drawer-close') return closeDrawer();
    if (action === 'submit-profile') {
      const body = { profileType: $('#f-type').value, eid: $('#f-eid').value.trim() || undefined, matchingId: $('#f-mid').value.trim() || undefined };
      await api('POST', '/profiles', body); closeModal(); toast('Profile created', '', 'ok'); return loadProfiles();
    }
    if (action === 'submit-batch') {
      await api('POST', '/batches', { name: $('#f-bname').value, count: +$('#f-bcount').value, profileType: $('#f-btype').value });
      closeModal(); toast('Batch created', '', 'ok'); return loadBatches();
    }
    if (action === 'submit-upp') {
      const file = $('#f-file').files[0]; if (!file) return toast('Upload', 'choose a file', 'err');
      const data = await fileToBase64(file);
      await api('POST', '/upp', { name: $('#f-uname').value || file.name, data });
      closeModal(); toast('Template stored', '', 'ok'); return loadUPP();
    }
    if (action === 'submit-perso') {
      const iccid = $('#f-piccid').value.trim();
      const body = { imsi: $('#f-pimsi').value.trim(), k: $('#f-pk').value.trim(), opc: $('#f-popc').value.trim(), spn: $('#f-pspn').value.trim(), algorithm: $('#f-palgo').value.trim(), pin1: $('#f-ppin').value.trim(), puk1: $('#f-ppuk').value.trim(), adm1: $('#f-padm1').value.trim(), adm2: $('#f-padm2').value.trim() };
      await api('PUT', '/personalization/' + encodeURIComponent(iccid), body);
      closeModal(); toast('Saved', iccid, 'ok'); return loadPerso();
    }
    if (action === 'submit-range') {
      await api('POST', '/iccid-ranges', { start: $('#f-rstart').value.trim(), end: $('#f-rend').value.trim(), note: $('#f-rnote').value.trim() });
      closeModal(); toast('Range imported', '', 'ok'); return loadPool();
    }
  } catch (e) { toast('Action failed', e.message, 'err'); }
}

function itemsTable(items) {
  if (!items.length) return empty('No items.', '📇');
  return `<table><thead><tr><th>ICCID</th><th>State</th><th>EID</th></tr></thead><tbody>${items.map(x =>
    `<tr><td class="mono">${esc(x.iccid)}</td><td>${badge(x.state)}</td><td class="mono">${esc(short(x.eid) || '–')}</td></tr>`).join('')}</tbody></table>`;
}
function decodedView(r) {
  return `<dl class="kv"><dt>SAIP</dt><dd>${r.major}.${r.minor}</dd><dt>Profile type</dt><dd>${esc(r.profileType || '–')}</dd>
    <dt>ICCID</dt><dd>${esc(r.iccid || '–')}</dd><dt>Services</dt><dd>${esc((r.services || []).join(', ') || '–')}</dd>
    <dt>GFSTE</dt><dd>${esc((r.gfste || []).join(', ') || '–')}</dd></dl>
    <h4 style="margin:14px 0 6px;color:var(--muted)">ProfileElements</h4>
    <table><thead><tr><th>Tag</th><th>Name</th><th>Size</th></tr></thead><tbody>${(r.elements || []).map(e => `<tr><td class="mono">${esc(e.tag)}</td><td>${esc(e.name || '–')}</td><td>${e.size}</td></tr>`).join('')}</tbody></table>
    <h4 style="margin:14px 0 6px;color:var(--muted)">Files</h4>
    <table><thead><tr><th>FID</th><th>PE</th><th>Body</th></tr></thead><tbody>${(r.files || []).map(f => `<tr><td class="mono">${esc(f.fid)}</td><td>${esc(f.peName || '–')}</td><td>${f.bodySize}</td></tr>`).join('')}</tbody></table>`;
}

function modalNewBatch() {
  showModal('New batch', `<div class="field"><label>Name</label><input id="f-bname" class="input" placeholder="Q4 rollout" /></div>
    <div class="two"><div class="field"><label>Count</label><input id="f-bcount" class="input" type="number" min="1" value="5" /></div>
    <div class="field"><label>Profile type</label><select id="f-btype"><option>operational</option><option>test</option><option>provisioning</option></select></div></div>
    <p style="color:var(--muted);font-size:12.5px">Creates <b>count</b> profiles (ICCIDs are taken from the pool when available).</p>`,
    `<button class="btn" data-action="modal-close">Cancel</button><button class="btn primary" data-action="submit-batch">Create batch</button>`);
}
function modalUploadUPP() {
  showModal('Upload UPP template', `<div class="two"><div class="field"><label>Name</label><input id="f-uname" class="input" placeholder="TS48v3_SAIP2.3_BERTLV.der" /></div>
    <div class="field"><label>File (.der)</label><input id="f-file" class="input" type="file" accept=".der,.bin" /></div></div>
    <p style="color:var(--muted);font-size:12.5px">The SAIP version is parsed server-side.</p>`,
    `<button class="btn" data-action="modal-close">Cancel</button><button class="btn primary" data-action="submit-upp">Upload</button>`);
}
function modalRange() {
  showModal('Import ICCID range', `<div class="two"><div class="field"><label>Start</label><input id="f-rstart" class="input mono" placeholder="8900012000000000000" /></div>
    <div class="field"><label>End</label><input id="f-rend" class="input mono" placeholder="8900012000000000099" /></div></div>
    <div class="field"><label>Note</label><input id="f-rnote" class="input" placeholder="optional" /></div>
    <p style="color:var(--muted);font-size:12.5px">Only Luhn-valid ICCIDs are added as available.</p>`,
    `<button class="btn" data-action="modal-close">Cancel</button><button class="btn primary" data-action="submit-range">Import</button>`);
}
async function modalPerso(iccid) {
  let rec = { iccid, imsi: '', k: '', opc: '', spn: '', algorithm: 'milenage', pin1: '', puk1: '', adm1: '', adm2: '' };
  if (iccid) { try { rec = Object.assign(rec, await api('GET', `/personalization/${encodeURIComponent(iccid)}?reveal=1`)); } catch {} }
  showModal(iccid ? `Personalization · ${esc(iccid)}` : 'New personalization record',
    `<div class="field"><label>ICCID</label><input id="f-piccid" class="input mono" value="${esc(rec.iccid || '')}" ${iccid ? 'readonly' : ''} /></div>
     <div class="two"><div class="field"><label>IMSI</label><input id="f-pimsi" class="input mono" value="${esc(rec.imsi || '')}" /></div>
     <div class="field"><label>Algorithm</label><input id="f-palgo" class="input" value="${esc(rec.algorithm || 'milenage')}" /></div></div>
     <div class="two"><div class="field"><label>K (hex)</label><input id="f-pk" class="input mono" value="${esc(rec.k || '')}" /></div>
     <div class="field"><label>OPc (hex)</label><input id="f-popc" class="input mono" value="${esc(rec.opc || '')}" /></div></div>
     <div class="field"><label>SPN</label><input id="f-pspn" class="input" value="${esc(rec.spn || '')}" /></div>
     <div class="two"><div class="field"><label>PIN1</label><input id="f-ppin" class="input" value="${esc(rec.pin1 || '')}" /></div>
     <div class="field"><label>PUK1</label><input id="f-ppuk" class="input" value="${esc(rec.puk1 || '')}" /></div></div>
     <div class="two"><div class="field"><label>ADM1</label><input id="f-padm1" class="input" value="${esc(rec.adm1 || '')}" /></div>
     <div class="field"><label>ADM2</label><input id="f-padm2" class="input" value="${esc(rec.adm2 || '')}" /></div></div>`,
    `<button class="btn" data-action="modal-close">Cancel</button><button class="btn primary" data-action="submit-perso">Save</button>`);
}
function modalNewProfile() {
  showModal('New profile', `<div class="two"><div class="field"><label>Profile type</label><select id="f-type"><option>operational</option><option>test</option><option>provisioning</option></select></div>
    <div class="field"><label>Matching ID (optional)</label><input id="f-mid" class="input" /></div></div>
    <div class="field"><label>EID (optional)</label><input id="f-eid" class="input mono" /></div>`,
    `<button class="btn" data-action="modal-close">Cancel</button><button class="btn primary" data-action="submit-profile">Create</button>`);
}
function fileToBase64(file) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(file); });
}

// ------------------------------------------------------------------ events
document.addEventListener('click', (e) => {
  const nav = e.target.closest('[data-section]');
  if (nav) { S.section = nav.dataset.section; render(); refresh(); return; }
  const pagerEl = e.target.closest('[data-pager]');
  if (pagerEl) { const dir = pagerEl.dataset.pager; const st = S[S.section === 'perso' ? 'perso' : S.section]; if (dir === 'prev' && st.page > 1) st.page--; if (dir === 'next') st.page++; refresh(); return; }
  const act = e.target.closest('[data-action]');
  if (act) { doAction(act.dataset.action, act); return; }
  if (e.target === $('#overlay')) { closeModal(); closeDrawer(); }
});
document.addEventListener('input', (e) => {
  const i = e.target.dataset.input; if (!i) return;
  if (i === 'profiles-q') { S.profiles.q = e.target.value; clearTimeout(window._t); window._t = setTimeout(() => { S.profiles.page = 1; loadProfiles(); }, 300); }
  if (i === 'profiles-state') { S.profiles.state = e.target.value; S.profiles.page = 1; loadProfiles(); }
  if (i === 'audit-subject') { S.audit.subject = e.target.value; clearTimeout(window._t2); window._t2 = setTimeout(() => { S.audit.page = 1; loadAudit(); }, 300); }
});
document.addEventListener('change', (e) => {
  const i = e.target.dataset.input; if (!i) return;
  if (i === 'audit-interface') { S.audit.interface = e.target.value; S.audit.page = 1; loadAudit(); }
});

// ------------------------------------------------------------------ boot
$('#base').value = S.base;
$('#mode').value = S.mode;
$('#connectBtn').addEventListener('click', connect);
$('#mode').addEventListener('change', connect);
render();
connect();
</script>
</body>
</html>
