<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>rsp42 · management console</title>
<style>
  :root {
    --bg: #f6f7fb; --panel: #ffffff; --panel-2: #fafbfe; --border: #e5e7ef;
    --text: #1b1f2a; --muted: #6b7280; --faint: #9aa1ad;
    --primary: #4f46e5; --primary-600: #4338ca; --primary-soft: #eef0ff;
    --green: #15803d; --green-soft: #e8f6ee; --amber: #b45309; --amber-soft: #fdf3e3;
    --red: #b91c1c; --red-soft: #fdecec; --blue: #1d4ed8; --blue-soft: #e9effd;
    --shadow: 0 1px 2px rgba(16,24,40,.04), 0 8px 24px rgba(16,24,40,.06);
    --radius: 12px; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1117; --panel: #161b22; --panel-2: #1b212b; --border: #262d38;
      --text: #e6eaf2; --muted: #9aa4b2; --faint: #6b7480;
      --primary: #7c8cff; --primary-600: #6d7cff; --primary-soft: #1e2438;
      --green: #4ade80; --green-soft: #12261a; --amber: #fbbf24; --amber-soft: #2a2111;
      --red: #f87171; --red-soft: #2a1414; --blue: #7aa2ff; --blue-soft: #141c2e;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--primary); text-decoration: none; }
  code, .mono { font-family: var(--mono); font-size: 12.5px; }

  .topbar {
    position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 12px;
    padding: 10px 16px; background: color-mix(in oklab, var(--panel) 88%, transparent);
    backdrop-filter: blur(8px); border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: .2px; }
  .brand .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--primary); box-shadow: 0 0 0 4px var(--primary-soft); }
  .brand small { font-weight: 500; color: var(--muted); }
  .spacer { flex: 1; }
  .connect { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .input, select, textarea {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 10px; font: inherit; outline: none; min-width: 0;
  }
  textarea { width: 100%; font-family: var(--mono); font-size: 12px; resize: vertical; }
  .input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
  .input.url { width: min(40vw, 380px); font-family: var(--mono); font-size: 12px; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); padding: 8px 12px; border-radius: 10px;
    font: inherit; cursor: pointer; transition: .15s ease; white-space: nowrap;
  }
  .btn:hover { border-color: color-mix(in oklab, var(--primary) 40%, var(--border)); transform: translateY(-1px); }
  .btn:active { transform: none; }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn.primary:hover { background: var(--primary-600); }
  .btn.ghost { background: transparent; }
  .btn.danger { color: var(--red); border-color: color-mix(in oklab, var(--red) 35%, var(--border)); }
  .btn.sm { padding: 5px 9px; border-radius: 8px; font-size: 12.5px; }
  .btn[disabled] { opacity: .5; cursor: not-allowed; transform: none; }

  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 12px; border: 1px solid var(--border); color: var(--muted); }
  .pill.ok { color: var(--green); background: var(--green-soft); border-color: transparent; }
  .pill.bad { color: var(--red); background: var(--red-soft); border-color: transparent; }
  .pill.warn { color: var(--amber); background: var(--amber-soft); border-color: transparent; }
  .dotlive { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }

  .layout { display: grid; grid-template-columns: 236px 1fr; min-height: calc(100% - 57px); }
  .sidebar { padding: 16px 12px; border-right: 1px solid var(--border); position: sticky; top: 57px; align-self: start; height: calc(100vh - 57px); overflow: auto; }
  .nav { display: flex; flex-direction: column; gap: 4px; }
  .nav button {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    padding: 9px 11px; border-radius: 10px; border: 1px solid transparent; background: transparent;
    color: var(--text); font: inherit; cursor: pointer;
  }
  .nav button:hover { background: var(--panel-2); }
  .nav button.active { background: var(--primary-soft); border-color: color-mix(in oklab, var(--primary) 25%, transparent); color: var(--primary); font-weight: 600; }
  .nav .ico { width: 18px; text-align: center; }
  .sidebar .hint { margin: 14px 6px 0; color: var(--faint); font-size: 11.5px; line-height: 1.5; }

  main { padding: 20px 22px 60px; max-width: 1280px; }
  .page-head { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .page-head h1 { font-size: 20px; margin: 0; }
  .page-head p { margin: 2px 0 0; color: var(--muted); font-size: 13px; max-width: 74ch; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 0 0 12px; }
  .toolbar .grow { flex: 1; }
  .toolbar label.inline { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12.5px; }

  .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
  .card .pad { padding: 14px 16px; }
  .grid { display: grid; gap: 14px; }
  .grid.cols { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
  .grid.two { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }

  table { width: 100%; border-collapse: collapse; }
  thead th {
    text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em;
    color: var(--faint); font-weight: 600; padding: 10px 14px; border-bottom: 1px solid var(--border);
    position: sticky; top: 0; background: var(--panel); z-index: 1;
  }
  tbody td { padding: 10px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tbody tr:hover { background: var(--panel-2); }
  tbody tr:last-child td { border-bottom: none; }
  td .actions { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }
  td.narrow, th.narrow { width: 34px; }

  .badge { display: inline-flex; align-items: center; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600; background: var(--primary-soft); color: var(--primary); white-space: nowrap; }
  .badge.installed, .badge.active, .badge.completed, .badge.available, .badge.confirmed { background: var(--green-soft); color: var(--green); }
  .badge.error, .badge.unavailable, .badge.blocked, .badge.failed, .badge.disabled, .badge.cancelled { background: var(--red-soft); color: var(--red); }
  .badge.downloaded, .badge.released, .badge.open, .badge.allocated-p, .badge.pool { background: var(--blue-soft); color: var(--blue); }
  .badge.allocated, .badge.linked, .badge.reserved, .badge.expired, .badge.reservationexpired { background: var(--amber-soft); color: var(--amber); }
  .badge.deleted { background: var(--panel-2); color: var(--faint); }
  .tag { display: inline-block; padding: 1px 7px; border-radius: 6px; background: var(--panel-2); border: 1px solid var(--border); color: var(--muted); font-size: 11.5px; font-family: var(--mono); }

  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); }
  .stat .k { color: var(--muted); font-size: 12px; text-transform: lowercase; }
  .stat .v { font-size: 24px; font-weight: 700; margin-top: 4px; }
  .stat .s { color: var(--faint); font-size: 11.5px; }

  .bars { display: flex; flex-direction: column; gap: 7px; }
  .bar { display: grid; grid-template-columns: minmax(90px, 160px) 1fr 52px; gap: 10px; align-items: center; font-size: 12.5px; }
  .bar .track { height: 8px; border-radius: 99px; background: var(--panel-2); border: 1px solid var(--border); overflow: hidden; }
  .bar .fill { height: 100%; background: var(--primary); }
  .bar .n { text-align: right; color: var(--muted); font-family: var(--mono); font-size: 12px; }

  .empty { padding: 40px 16px; text-align: center; color: var(--muted); }
  .empty .big { font-size: 30px; opacity: .5; }
  .pager { display: flex; align-items: center; gap: 10px; padding: 10px 14px; color: var(--muted); font-size: 12.5px; }

  .bulkbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 14px; margin-bottom: 10px; border: 1px solid color-mix(in oklab, var(--primary) 30%, var(--border)); background: var(--primary-soft); border-radius: var(--radius); color: var(--primary); }

  .toasts { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 60; }
  .toast { background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--primary); border-radius: 10px; box-shadow: var(--shadow); padding: 10px 12px; max-width: 380px; animation: slidein .18s ease; }
  .toast.ok { border-left-color: var(--green); }
  .toast.err { border-left-color: var(--red); }
  .toast .t { font-weight: 600; }
  .toast .m { color: var(--muted); font-size: 12.5px; word-break: break-word; }
  @keyframes slidein { from { transform: translateY(6px); opacity: 0 } to { transform: none; opacity: 1 } }

  .overlay { position: fixed; inset: 0; background: rgba(10,12,18,.44); display: none; z-index: 40; }
  .overlay.show { display: block; }
  .modal { position: fixed; z-index: 50; top: 6vh; left: 50%; transform: translateX(-50%); width: min(760px, 94vw); max-height: 88vh; overflow: auto; display: none; }
  .modal.show { display: block; }
  .modal .head, .drawer .head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--panel); z-index: 2; }
  .modal .head h3, .drawer .head h3 { margin: 0; font-size: 15px; flex: 1; }
  .modal .body { padding: 16px; }
  .modal .foot { display: flex; gap: 8px; justify-content: flex-end; padding: 12px 16px; border-top: 1px solid var(--border); position: sticky; bottom: 0; background: var(--panel); }
  .drawer { position: fixed; z-index: 50; top: 0; right: 0; height: 100%; width: min(620px, 96vw); background: var(--panel); border-left: 1px solid var(--border); box-shadow: var(--shadow); transform: translateX(102%); transition: transform .22s ease; overflow: auto; }
  .drawer.show { transform: none; }
  .drawer .body { padding: 16px; }

  .field { display: grid; gap: 5px; margin-bottom: 12px; }
  .field label { font-size: 12px; color: var(--muted); font-weight: 600; }
  .field .row { display: flex; gap: 8px; }
  .field .row > * { flex: 1; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .three { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

  dl.kv { display: grid; grid-template-columns: 150px 1fr; gap: 6px 12px; margin: 0; }
  dl.kv dt { color: var(--muted); font-size: 12px; }
  dl.kv dd { margin: 0; font-family: var(--mono); font-size: 12.5px; word-break: break-all; }

  .timeline { list-style: none; margin: 0; padding: 0; }
  .timeline li { position: relative; padding: 8px 0 8px 20px; border-left: 1px dashed var(--border); margin-left: 6px; }
  .timeline li:before { content: ""; position: absolute; left: -5px; top: 14px; width: 9px; height: 9px; border-radius: 50%; background: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
  .timeline .when { color: var(--faint); font-size: 11.5px; }
  .timeline .what { font-weight: 600; }

  .banner { display: none; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 10px; margin-bottom: 12px; }
  .banner.show { display: flex; }
  .banner.warn { background: var(--amber-soft); color: var(--amber); }
  .banner.err { background: var(--red-soft); color: var(--red); }

  pre.json { background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; padding: 10px; overflow: auto; max-height: 340px; font-family: var(--mono); font-size: 12px; margin: 0; white-space: pre-wrap; word-break: break-word; }

  .spin { width: 15px; height: 15px; border: 2px solid color-mix(in oklab, var(--primary) 30%, transparent); border-top-color: var(--primary); border-radius: 50%; animation: rot .7s linear infinite; display: inline-block; }
  @keyframes rot { to { transform: rotate(360deg) } }
  .loading { padding: 26px; text-align: center; color: var(--muted); }
  h4.sec { margin: 16px 0 6px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }

  @media (max-width: 980px) {
    .layout { grid-template-columns: 1fr; }
    .sidebar { position: static; height: auto; border-right: none; border-bottom: 1px solid var(--border); }
    .nav { flex-direction: row; flex-wrap: wrap; }
    .nav button { width: auto; }
    .two, .three { grid-template-columns: 1fr; }
    .input.url { width: 100%; }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="dot"></span>rsp42 <small>· management console</small></div>
  <div class="spacer"></div>
  <div class="connect">
    <input id="base" class="input url" spellcheck="false" placeholder="http://127.0.0.1:9000/admin/api/v1" />
    <select id="mode" title="Data source">
      <option value="api">Live API</option>
      <option value="demo">Demo data</option>
    </select>
    <select id="tenant" title="Tenant scope (sent as ?tenant=)"></select>
    <button id="connectBtn" class="btn primary">Connect</button>
    <span id="status" class="pill"><span class="dotlive"></span><span id="statusText">idle</span></span>
  </div>
</header>

<div class="overlay" id="overlay"></div>

<div class="layout">
  <aside class="sidebar">
    <nav class="nav" id="nav"></nav>
    <div class="hint">
      BSS/OSS-facing management API. No authentication — deploy on a trusted network.
      <div style="margin-top:8px">Source: <span id="clientKind" class="mono">–</span></div>
      <div style="margin-top:4px">Scope: <span id="tenantScope" class="mono">all tenants</span></div>
      <div style="margin-top:8px"><a id="specLink" href="#" target="_blank" rel="noreferrer">OpenAPI document ↗</a></div>
      <div style="margin-top:8px">SM-DP+ admin is :9000, SM-DS admin is :9100 (serves only <span class="mono">/events</span> and <span class="mono">/openapi.json</span>).</div>
    </div>
  </aside>
  <main>
    <div id="banner" class="banner warn"></div>
    <div id="view"></div>
  </main>
</div>

<div class="toasts" id="toasts"></div>
<div class="modal card" id="modal"></div>
<aside class="drawer" id="drawer"></aside>

<script type="module">
// ===================================================================== helpers
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const fmtTime = (t) => { if (!t) return '–'; const d = new Date(t); return isNaN(d) ? esc(t) : d.toLocaleString(); };
const short = (s, n = 16) => { s = String(s ?? ''); return s.length > n ? s.slice(0, n) + '…' : s; };
const attr = (v) => esc(v ?? '');
const newKey = () => (crypto.randomUUID ? crypto.randomUUID() : 'k-' + Date.now() + '-' + Math.random().toString(16).slice(2));

function toast(title, msg = '', kind = '') {
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.innerHTML = `<div class="t">${esc(title)}</div>${msg ? `<div class="m">${esc(msg)}</div>` : ''}`;
  $('#toasts').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 320); }, 5000);
}
function badge(text) {
  const cls = String(text).toLowerCase().replace(/[^a-z]/g, '');
  return `<span class="badge ${cls}">${esc(text)}</span>`;
}
function boolBadge(v, yes = 'yes', no = 'no') { return v ? badge(yes) : `<span class="badge error">${esc(no)}</span>`; }
function loading() { return `<div class="loading"><span class="spin"></span> loading…</div>`; }
function empty(msg, icon = '∅') { return `<div class="empty"><div class="big">${icon}</div><div>${esc(msg)}</div></div>`; }
function errBox(msg) { return `<div class="card"><div class="empty"><div class="big">⚠️</div><div>${esc(msg)}</div></div></div>`; }
function pager(state) {
  const pages = Math.max(1, Math.ceil(state.total / state.size));
  return `<div class="pager">
    <button class="btn sm" ${state.page <= 1 ? 'disabled' : ''} data-pager="prev">‹ Prev</button>
    <span>page ${state.page} / ${pages} · ${state.total} total</span>
    <button class="btn sm" ${state.page >= pages ? 'disabled' : ''} data-pager="next">Next ›</button>
  </div>`;
}
function bars(buckets) {
  if (!buckets || !buckets.length) return empty('No data.', '📊');
  const max = Math.max(...buckets.map(b => b.count)) || 1;
  return `<div class="bars">${buckets.map(b => `<div class="bar">
    <div class="mono">${esc(b.key || '(default)')}</div>
    <div class="track"><div class="fill" style="width:${Math.round(100 * b.count / max)}%"></div></div>
    <div class="n">${b.count}</div></div>`).join('')}</div>`;
}
function saveBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
function debounce(fn, ms = 300) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
function field(label, input) { return `<div class="field"><label>${esc(label)}</label>${input}</div>`; }
function opt(v, cur) { return `<option value="${attr(v)}" ${String(v) === String(cur) ? 'selected' : ''}>${esc(v === '' ? '(platform default)' : v)}</option>`; }

// ===================================================================== state
const SECTIONS = [
  { id: 'dashboard', icon: '📊', label: 'Overview' },
  { id: 'profiles',  icon: '📇', label: 'Profiles' },
  { id: 'batches',   icon: '🗂️', label: 'Download lists' },
  { id: 'upp',       icon: '🧩', label: 'UPP templates' },
  { id: 'perso',     icon: '🔑', label: 'Personalization' },
  { id: 'pool',      icon: '🔢', label: 'ICCID pool' },
  { id: 'eids',      icon: '📱', label: 'eUICCs' },
  { id: 'notifs',    icon: '🔔', label: 'Notifications' },
  { id: 'audit',     icon: '📜', label: 'Audit log' },
  { id: 'events',    icon: '📡', label: 'SM-DS events' },
  { id: 'tenants',   icon: '🏢', label: 'Tenants' },
];

const S = {
  base: localStorage.getItem('rsp42.base') || 'http://127.0.0.1:9000/admin/api/v1',
  mode: localStorage.getItem('rsp42.mode') || 'api',
  tenant: localStorage.getItem('rsp42.tenant') === null ? null
        : (localStorage.getItem('rsp42.tenant') === '*' ? null : localStorage.getItem('rsp42.tenant')),
  transport: null, kind: '–', connected: false, specServed: false,
  section: 'profiles',
  tenants:    { items: [], loading: false, error: '' },
  dashboard:  { data: null, loading: false, error: '' },
  profiles:   { page: 1, size: 25, total: 0, items: [], loading: false, error: '',
                q: '', state: '', eid: '', iccid: '', externalRef: '', batchId: '', from: '', to: '', sort: '',
                stats: [], selected: new Set() },
  batches:    { page: 1, size: 25, total: 0, items: [], loading: false, error: '' },
  upp:        { items: [], loading: false, error: '' },
  perso:      { page: 1, size: 25, total: 0, items: [], loading: false, error: '', iccid: '', reveal: false },
  pool:       { page: 1, size: 25, total: 0, items: [], ranges: [], stats: null, loading: false, error: '', state: '', iccid: '' },
  eids:       { page: 1, size: 25, total: 0, items: [], loading: false, error: '', state: '', from: '', to: '' },
  notifs:     { page: 1, size: 25, total: 0, items: [], loading: false, error: '', iccid: '', eid: '', from: '', to: '' },
  audit:      { page: 1, size: 25, total: 0, items: [], loading: false, error: '', stats: null,
                interface: '', function: '', subject: '', actor: '', outcome: '', from: '', to: '' },
  events:     { page: 1, size: 25, total: 0, items: [], loading: false, error: '', stats: null,
                eid: '', eventId: '', iccid: '', matchingId: '', status: '', from: '', to: '', sort: '' },
};

// ===================================================================== transports
function buildURL(base, path, params) {
  const url = new URL(base.replace(/\/+$/, '') + path, window.location.href);
  if (params) for (const [k, v] of Object.entries(params)) {
    // Only null/undefined are dropped: an empty `tenant=` is meaningful (it
    // selects the platform-default scope, while omitting it spans all owners).
    if (v === undefined || v === null) continue;
    url.searchParams.set(k, v);
  }
  return url;
}

function makeFetchTransport(base) {
  async function request(method, path, opts = {}) {
    const { body, params, idem, contentType } = opts;
    const url = buildURL(base, path, params);
    const headers = { Accept: 'application/json' };
    let payload;
    if (body !== undefined && body !== null) {
      if (typeof body === 'string') { headers['Content-Type'] = contentType || 'text/csv'; payload = body; }
      else { headers['Content-Type'] = 'application/json'; payload = JSON.stringify(body); }
    }
    if (idem) headers['Idempotency-Key'] = idem;
    let res;
    try { res = await fetch(url, { method, headers, body: payload }); }

    }

  }
  async function download(path, params) {

      const text = await res.text();
      let data = null; try { data = JSON.parse(text); } catch {}
      throw new Error((data && (data.message || data.error)) || `${res.status} ${res.statusText}`);
    }
    return await res.blob();
  }
  return { request, download, kind: 'fetch' };
}

      if (sub === 'cancel') { rec.state = String(body?.finalStatus).toLowerCase() === 'unavailable' ? 'Unavailable' : 'Available'; rec.updatedAt = nowIso(); return { data: rec, status: 200 }; }
      if (sub === 'release') { rec.state = 'Released'; rec.updatedAt = nowIso(); return { data: rec, status: 200 }; }
      if (sub === 'activation-code') {
        if (p.rotate === '1' || p.rotate === 1) rec.matchingId = 'MATCH-' + Math.random().toString(16).slice(2, 18).toUpperCase();
        if (!rec.matchingId) bad('profile has no matchingId; confirm the order first');
        const ac = `1$testsmdpplus1.example.com$${rec.matchingId}`;
        return { data: { matchingId: rec.matchingId, activationCode: ac, qrContent: 'LPA:1$testsmdpplus1.example.com$' + rec.matchingId }, status: 200 };
      }
      if (sub === 'timeline') {
        const ev = [
          { time: rec.updatedAt, kind: 'order', action: 'downloadOrder', detail: rec.matchingId },
          { time: rec.updatedAt, kind: 'notification', action: 'install', detail: 'A1B2C3D4', signed: true, processed: rec.state === 'Installed' },
          { time: rec.createdAt, kind: 'audit', action: 'admin:createProfile', detail: 'Executed-Success' },
        ];
        return { data: { iccid: rec.iccid, events: ev }, status: 200 };
      }
    }
    function materials(b, create = false) {
      const iccid = (b?.iccid || '8900012' + String(++seq).padStart(11, '0')).replace(/[fF]+$/, '');
      if (create && find(profiles, 'iccid', iccid)) conflict('ICCID already exists');
      const rec = mkProfile({
        iccid, tenant: b?.tenant ?? '', eid: b?.eid || '', profileType: b?.profileType || 'operational',
        matchingId: b?.matchingId || '', smdsAddress: b?.smdsAddress || '', uppTemplate: b?.uppTemplate || '',
        externalRef: b?.externalRef || '', state: 'Allocated', createdAt: nowIso(), updatedAt: nowIso(),
      });
      profiles.unshift(rec);
      return rec;
    }

    // ---- batches
    if (seg[0] === 'batches') {
      if (!seg[1]) {
        if (method === 'GET') {
          const items = batches.filter(b => (b.tenant || '') === (p.tenant ?? ''));
          return { data: page(items, p), status: 200 };
        }
        if (method === 'POST') {
          if (!(body?.count >= 1)) bad('count must be between 1 and 1000');
          const b = { id: batches.length + 1, name: body.name || '', profileType: body.profileType || '', state: 'Open',
            total: body.count, note: body.note || '', createdAt: nowIso(), updatedAt: nowIso() };
          for (let i = 0; i < body.count; i++) { const r = materials({ tenant: p.tenant ?? '', eid: body.eid || '', profileType: body.profileType, uppTemplate: body.uppTemplate }, true); r.batchId = b.id; }
          batches.unshift(b);
          return { data: b, status: 201 };
        }
      }
      const b = find(batches, 'id', seg[1]);
      if (!b) notFound('unknown batch');
      if (!seg[2]) {
        if (method === 'GET') {
          const states = {};
          for (const x of profiles.filter(x => x.batchId === b.id)) states[x.state] = (states[x.state] || 0) + 1;
          return { data: { batch: b, states }, status: 200 };
        }
        if (method === 'DELETE') { batches.splice(batches.indexOf(b), 1); return { data: null, status: 204 }; }
      }
      if (seg[2] === 'items') return { data: page(profiles.filter(x => x.batchId === b.id), p), status: 200 };
      if (seg[2] === 'confirm' || seg[2] === 'cancel') {
        let applied = 0, failed = 0;
        for (const x of profiles.filter(x => x.batchId === b.id)) {
          if (seg[2] === 'confirm') { x.state = body?.release ? 'Released' : 'Confirmed'; applied++; }
          else { x.state = String(body?.finalStatus).toLowerCase() === 'unavailable' ? 'Unavailable' : 'Available'; applied++; }
          x.updatedAt = nowIso();
        }
        b.state = seg[2] === 'confirm' ? 'Completed' : 'Cancelled'; b.updatedAt = nowIso();
        return { data: { applied, failed }, status: 200 };
      }
    }

    // ---- upp
    if (seg[0] === 'upp') {
      if (!seg[1]) {
        if (method === 'GET') {
          const items = upp.filter(x => p.tenant === undefined ? true : ((x.tenant || '') === p.tenant || x.tenant === ''));
          return { data: { items, total: items.length }, status: 200 };
        }
        if (method === 'POST') {
          if (!body?.name) bad('name is required');
          if (!body?.data) bad('data must be base64-encoded DER');
          const t = { name: body.name, tenant: body.tenant ?? p.tenant ?? '', saipMajor: 2, saipMinor: 3, saip: '2.3',
            sha256: (body.data.slice(0, 64) + '0'.repeat(64)).slice(0, 64).toLowerCase(), active: true,
            size: Math.ceil(body.data.length * 3 / 4), createdAt: nowIso(), updatedAt: nowIso(), bytes: uppBytes(400) };
          const i = upp.findIndex(x => x.name === t.name && (x.tenant || '') === (t.tenant || ''));
          if (i >= 0) upp[i] = t; else upp.unshift(t);
          (versions[t.name] = versions[t.name] || []).unshift({ id: ++versionSeq, tenant: t.tenant, name: t.name, versionNo: (versions[t.name]?.length || 0) + 1, saip: t.saip, sha256: t.sha256, size: t.size, note: 'uploaded through the management API', createdAt: nowIso() });
          return { data: t, status: 200 };
        }
      }
      if (seg[1] === 'validate' && method === 'POST') {
        if (!body?.data) bad('data must be base64-encoded DER');
        return { data: { valid: true, inspection: inspection() }, status: 200 };
      }
      if (seg[1] === 'render' && method === 'POST') {
        if (!body?.name) bad('name is required');
        const t = resolveTemplate(body.name, p);
        if (!body.imsi && !body.k) return { data: { rendered: false, error: 'personalization has no usable field' }, status: 200 };
        return { data: { rendered: true, template: t, inspection: inspection(t), bytes: t.size + 17 }, status: 200 };
      }
      const t = resolveTemplate(seg[1], p);
      if (!seg[2]) {
        if (method === 'GET') return { data: t, status: 200 };
        if (method === 'DELETE') { upp.splice(upp.indexOf(t), 1); return { data: null, status: 204 }; }
      }
      if (seg[2] === 'bytes') return { data: null, status: 200, binary: true, bytes: t.bytes, filename: t.name };
      if (seg[2] === 'decoded') return { data: decoded(t), status: 200 };
      if (seg[2] === 'schema') return { data: { template: t, inspection: inspection(t), fields: schemaFields() }, status: 200 };
      if (seg[2] === 'activate') { t.active = true; t.updatedAt = nowIso(); return { data: t, status: 200 }; }
      if (seg[2] === 'deactivate') { t.active = false; t.updatedAt = nowIso(); return { data: t, status: 200 }; }
      if (seg[2] === 'clone' && method === 'POST') {
        const tenant = body?.tenant ?? p.tenant ?? '';
        validateTenant(tenant);
        if (!tenant) bad('tenant is required for a clone (use promote to make a global template)');
        const name = body?.name || t.name;
        const q = { name, tenant, saipMajor: t.saipMajor, saipMinor: t.saipMinor, saip: t.saip, sha256: t.sha256,
          active: true, size: t.size, createdAt: nowIso(), updatedAt: nowIso(), bytes: t.bytes };
        upp.push(q);
        return { data: q, status: 201 };
      }
      if (seg[2] === 'promote' && method === 'POST') {
        const tenant = p.tenant ?? '';
        if (!tenant) bad('tenant is required (only a tenant template can be promoted)');
        if (upp.some(x => x.name === t.name && x.tenant === '') && p.overwrite !== '1')
          conflict(`a global template named "${t.name}" already exists (pass overwrite=1 to replace it)`);
        const g = { ...t, tenant: '' };
        const i = upp.findIndex(x => x.name === t.name && x.tenant === '');
        if (i >= 0) upp[i] = g; else upp.push(g);
        return { data: g, status: 200 };
      }
      if (seg[2] === 'versions') {
        if (!seg[3]) return { data: { items: versions[t.name] || [], total: (versions[t.name] || []).length }, status: 200 };
        if (seg[4] === 'restore' && method === 'POST') {
          const v = (versions[t.name] || []).find(x => String(x.id) === seg[3]);
          if (!v) notFound('unknown template version');
          Object.assign(t, { saipMajor: 2, saipMinor: 3, saip: v.saip, sha256: v.sha256, size: v.size, active: true, updatedAt: nowIso() });
          return { data: t, status: 200 };
        }
      }
    }
    function inspection(t) {
      return { saipMajor: t?.saipMajor ?? 2, saipMinor: t?.saipMinor ?? 3, saip: t?.saip ?? '2.3',
        sha256: t?.sha256 ?? '43af15322855', size: t?.size ?? 42000, profileType: 'GSMA Generic eUICC Test Profile',
        iccid: '89000123456789012341', services: ['usim', 'isim', 'javacard'],
        gfste: ['2.23.143.1.2.1', '2.23.143.1.2.3'],
        elements: [{ tag: 'A0', name: 'header', size: 137 }, { tag: 'B0', name: 'mf', size: 761 }],
        files: [{ fid: '2FE2', pename: 'mf', bodySize: 10 }, { fid: '6F07', pename: 'usim', bodySize: 9 }],
        warnings: [] };
    }
    function decoded(t) {
      const i = inspection(t);
      return { name: t.name, major: i.saipMajor, minor: i.saipMinor, profileType: i.profileType, iccid: i.iccid,
        services: i.services, gfste: i.gfste, elements: i.elements, files: i.files };
    }
    function schemaFields() {
      return [
        { name: 'iccid', type: 'string', required: true, pattern: '^[0-9]{19,20}$', description: '19-20 digits with a valid Luhn check digit.' },
        { name: 'imsi', type: 'string', required: false, pattern: '^[0-9]{14,15}$', description: 'Also the credentials-pool key when no ICCID is set yet.' },
        { name: 'k', type: 'string', required: false, minLength: 32, maxLength: 32, description: 'Hex-encoded 128-bit Ki.' },
        { name: 'opc', type: 'string', required: false, minLength: 32, maxLength: 32, description: 'Hex-encoded 128-bit OPc.' },
        { name: 'algorithm', type: 'string', required: false, enum: ['milenage', 'tuak', 'usim-test-algorithm'] },
        { name: 'pin1', type: 'string', required: false, minLength: 4, maxLength: 8 },
        { name: 'puk1', type: 'string', required: false, minLength: 8, maxLength: 8 },
        { name: 'adm1', type: 'string', required: false, minLength: 4, maxLength: 8 },
        { name: 'adm2', type: 'string', required: false, minLength: 4, maxLength: 8 },
        { name: 'spn', type: 'string', required: false, maxLength: 16, description: 'Service provider name written to EF.SPN.' },
        { name: 'plmn', type: 'array', required: false, description: 'Preferred PLMN list: {mcc, mnc, act}.' },
        { name: 'msisdn', type: 'string', required: false, pattern: '^[0-9]{1,15}$' },
        { name: 'acc', type: 'integer', required: false, description: 'EF.ACC value (0-65535).' },
        { name: 'filePatches', type: 'array', required: false, description: 'Raw EF overrides: {fid, hex}.' },
        { name: 'rotation', type: 'string', required: false, description: 'Hex Milenage/TUAK rotation constants (5 bytes).' },
        { name: 'xoring', type: 'string', required: false, description: 'Hex Milenage/TUAK xoring constants (80 bytes).' },
        { name: 'numberOfKeccak', type: 'integer', required: false },
      ];
    }

    // ---- audit / notifications / eids / events
    if (seg[0] === 'audit') {
      if (seg[1] === 'stats') return { data: auditStats(p), status: 200 };
      if (method === 'GET') return { data: page(auditFiltered(p), p), status: 200 };
    }
    if (seg[0] === 'notifications' && method === 'GET') {
      const items = notifications.filter(n =>
        (!p.iccid || String(n.iccid || '').startsWith(p.iccid)) &&
        (!p.eid || String(n.eid || '').includes(p.eid)) &&
        (!p.from || new Date(n.receivedAt) >= new Date(p.from)) &&
        (!p.to || new Date(n.receivedAt) <= new Date(p.to)));
      return { data: page(items, p), status: 200 };
    }
    if (seg[0] === 'eids' && method === 'GET') {
      const byEid = new Map();
      for (const x of filterProfiles(p)) {
        if (!x.eid) continue;
        const e = byEid.get(x.eid) || { eid: x.eid, profileCount: 0, installedCount: 0, lastUpdatedAt: x.updatedAt };
        e.profileCount++;
        if (x.state === 'Installed') e.installedCount++;
        if (new Date(x.updatedAt) > new Date(e.lastUpdatedAt)) e.lastUpdatedAt = x.updatedAt;
        byEid.set(x.eid, e);
      }
      return { data: page([...byEid.values()], p), status: 200 };
    }
    if (seg[0] === 'events' && method === 'GET') {
      const now = Date.now();
      const statusOf = (e) => e.deletedAt ? 'deleted' : (e.expiresAt && new Date(e.expiresAt).getTime() < now ? 'expired' : 'active');
      let items = events.filter(e => {
        if (!tenantEq(e.tenant, p.tenant)) return false;
        if (p.eid && !String(e.eid).includes(p.eid)) return false;
        if (p.eventId && e.eventId !== p.eventId) return false;
        if (p.iccid && String(e.iccid || '') !== p.iccid) return false;
        if (p.matchingId && e.matchingId !== p.matchingId) return false;
        if (p.status && p.status !== 'any' && statusOf(e) !== p.status) return false;
        if (p.from && new Date(e.registeredAt) < new Date(p.from)) return false;
        if (p.to && new Date(e.registeredAt) > new Date(p.to)) return false;
        return true;
      }).map(e => ({ ...e, status: statusOf(e) }));
      items = items.sort((a, b) => String(a.registeredAt).localeCompare(String(b.registeredAt)));
      if (!p.sort || !p.sort.startsWith('-')) items.reverse();
      return { data: page(items, p), status: 200 };
    }

    // ---- personalization
    if (seg[0] === 'personalization') {
      if (seg[1] === 'export' && method === 'GET') {
        const items = perso.filter(x => tenantEq(x.tenant, p.tenant === undefined ? undefined : p.tenant) && (!p.iccid || String(x.iccid || '').startsWith(p.iccid)));
        if (p.format === 'json') return { data: { items, total: items.length }, status: 200 };
        const rows = [['iccid', 'imsi', 'k', 'opc', 'pin1', 'puk1', 'adm1', 'adm2', 'spn', 'algorithm', 'rotation', 'xoring', 'numberOfKeccak', 'plmn', 'msisdn', 'acc', 'filePatches']];
        for (const d of items) rows.push([d.iccid, d.imsi, d.k, d.opc, d.pin1, d.puk1, d.adm1, d.adm2, d.spn, d.algorithm,
          d.rotation, d.xoring, d.numberOfKeccak ?? '', JSON.stringify(d.plmn || []), d.msisdn, d.acc ?? '', JSON.stringify(d.filePatches || [])]);

      }
      if (seg[1] === 'import' && method === 'POST') {
        const records = body?.records || [];

          putPerso(r.iccid, r, p.tenant ?? '');

        }

      }
      if (seg[1] === 'pool' && seg[2] === 'import' && method === 'POST') {

        for (const r of records) {
          if (!r.imsi) { results.push({ imsi: '', ok: false, error: 'record has no imsi' }); continue; }

        }
        return { data: { imported: ok, results }, status: 200 };
      }
      if (!seg[1] && method === 'GET') {
        const reveal = p.reveal === '1' || p.reveal === 1 || p.reveal === true;
        const items = perso.filter(x => (p.tenant === undefined || (x.tenant || '') === p.tenant) && (!p.iccid || String(x.iccid || '').startsWith(p.iccid)))
          .map(x => reveal ? x : { ...x, k: undefined, opc: undefined, rotation: undefined, xoring: undefined });
        return { data: page(items, p), status: 200 };
      }
      const iccid = seg[1].replace(/[fF]+$/, '');
      let rec = perso.find(x => x.iccid === iccid && String(x.iccid) !== '');
      if (method === 'GET') {
        if (!rec) notFound('no personalization for ICCID');
        const reveal = p.reveal === '1' || p.reveal === 1 || p.reveal === true;
        return { data: reveal ? rec : { ...rec, k: undefined, opc: undefined, rotation: undefined, xoring: undefined }, status: 200 };
      }
      if (method === 'PUT') return { data: putPerso(iccid, body, p.tenant ?? ''), status: 200 };
      if (method === 'DELETE') {
        const i = perso.findIndex(x => x.iccid === iccid);
        if (i < 0) notFound('no personalization for ICCID');
        perso.splice(i, 1);
        return { data: null, status: 204 };
      }
    }
    function putPerso(iccid, b, tenant) {
      const rec = {
        iccid, tenant: tenant || '', imsi: b.imsi || '', spn: b.spn || '', algorithm: b.algorithm || 'milenage',
        hasK: !!b.k, hasOPc: !!b.opc, k: b.k || '', opc: b.opc || '', pin1: b.pin1 || '', puk1: b.puk1 || '',
        adm1: b.adm1 || '', adm2: b.adm2 || '', numberOfKeccak: b.numberOfKeccak, plmn: b.plmn || [],
        msisdn: b.msisdn || '', acc: b.acc, filePatches: b.filePatches || [], rotation: b.rotation || '',
        xoring: b.xoring || '', pool: iccid === '',
      };
      const i = perso.findIndex(x => x.iccid === iccid);
      if (i >= 0) perso[i] = rec; else perso.unshift(rec);

    }

    // ---- iccid pool + ranges
    if (seg[0] === 'iccid-pool') {
      if (seg[1] === 'stats') {
        const counts = {};
        for (const x of pool.filter(x => tenantEq(x.tenant, p.tenant))) counts[x.state] = (counts[x.state] || 0) + 1;
        counts.reservation_expired = pool.filter(x => x.state === 'allocated' && x.reservedUntil && new Date(x.reservedUntil) < new Date() && tenantEq(x.tenant, p.tenant)).length;
        const out = { states: counts, ranges: ranges.filter(r => tenantEq(r.tenant, p.tenant)).length, available: counts.available || 0 };
        if (p.tenant !== undefined) out.credentials_unbound = perso.filter(x => x.iccid === '' && (x.tenant || '') === p.tenant).length;
        return { data: out, status: 200 };
      }
      if (seg[1] === 'reserve' && method === 'POST') {
        const tenant = body?.tenant ?? p.tenant ?? '';
        validateTenant(tenant);
        const e = pool.find(x => x.state === 'available' && (x.tenant || '') === tenant);
        if (!e) conflict('no available ICCID in the pool');
        e.state = 'allocated'; e.tenant = tenant; e.eid = body?.eid || ''; e.reference = body?.reference || '';
        const ttl = body?.ttlSeconds > 0 ? body.ttlSeconds : 900;
        e.reservedUntil = new Date(Date.now() + ttl * 1000).toISOString();
        const resp = { iccid: e.iccid, state: 'allocated', tenant };
        const cred = perso.find(x => x.iccid === '' && (x.tenant || '') === tenant);
        if (cred) { cred.iccid = e.iccid; cred.pool = false; resp.imsi = cred.imsi; }
        return { data: resp, status: 200 };
      }
      if ((seg[1] === 'release' || seg[1] === 'block') && method === 'POST') {
        const e = find(pool, 'iccid', body?.iccid);
        if (!e) notFound('unknown ICCID');
        e.state = seg[1] === 'release' ? 'available' : 'blocked';
        e.reservedUntil = undefined;
        if (seg[1] === 'release') { const c = perso.find(x => x.iccid === e.iccid); if (c) { c.iccid = ''; c.pool = true; } }
        return { data: { iccid: e.iccid, state: e.state }, status: 200 };
      }
      if (method === 'GET') {
        const items = pool.filter(x => tenantEq(x.tenant, p.tenant) && (!p.state || x.state === p.state) && (!p.iccid || x.iccid.startsWith(p.iccid)));
        return { data: page(items, p), status: 200 };
      }
    }
    if (seg[0] === 'iccid-ranges') {
      if (method === 'GET') {
        const items = ranges.filter(r => tenantEq(r.tenant, p.tenant));
        return { data: { items }, status: 200 };
      }
      if (method === 'POST') {
        const tenant = body?.tenant ?? p.tenant ?? '';
        validateTenant(tenant);
        if (!body?.start || !body?.end) bad('start and end are required');
        const r = { id: ranges.length + 1, tenant, start: body.start, end: body.end, note: body.note || '', createdAt: nowIso() };
        ranges.push(r);
        return { data: { rangeId: r.id, inserted: 100, skipped: 0, tenant }, status: 201 };
      }
      if (method === 'DELETE') {
        const i = ranges.findIndex(x => String(x.id) === seg[1]);
        if (i < 0) notFound('unknown range');
        ranges.splice(i, 1);
        return { data: { removed: 100 }, status: 200 };
      }
    }

    if (seg[0] === 'openapi.json') {
      return { data: { openapi: '3.0.3', info: { title: 'rsp42 SM-DP+ management API', version: '0.2.0' }, paths: {} }, status: 200 };
    }
    err(404, 'not_found', `demo: ${method} ${path} not implemented`);
  }

  async function download(path, params) {
    const out = await request('GET', path, { params });
    if (out.contentType === 'text/csv') return new Blob([out.data], { type: 'text/csv' });
    if (path.endsWith('/bytes')) return new Blob([out.bytes], { type: 'application/octet-stream' });
    return new Blob([JSON.stringify(out.data, null, 2)], { type: 'application/json' });
  }

  return { request, download, kind: 'demo data' };
}

// ===================================================================== API calls
function tenantParams() { return S.tenant === null ? {} : { tenant: S.tenant }; }

async function apiReq(method, path, opts = {}) {
  if (!S.transport) throw new Error('not connected');
  const params = Object.assign({}, tenantParams(), opts.params || {});
  const out = await S.transport.request(method, path, { body: opts.body, params, idem: opts.idem, contentType: opts.contentType });
  if (out.replayed) toast('Idempotent replay', method + ' ' + path + ' replayed the recorded response');
  return out.data;
}
const apiGet = (p, params) => apiReq('GET', p, { params });
const apiWrite = (m, p, body, opts = {}) => apiReq(m, p, { body, ...opts });

// ===================================================================== shell
function renderNav() {
  $('#nav').innerHTML = SECTIONS.map(s =>
    `<button data-section="${s.id}" class="${S.section === s.id ? 'active' : ''}"><span class="ico">${s.icon}</span>${s.label}</button>`).join('');
}
function setStatus(text, cls = '') {
  $('#status').className = 'pill ' + cls;
  $('#statusText').textContent = text;
}
function banner(msg, kind = 'warn') {
  const b = $('#banner');
  if (!msg) { b.className = 'banner'; b.innerHTML = ''; return; }
  b.className = 'banner show ' + kind;
  b.innerHTML = `<span>⚠️</span><div>${msg}</div>`;
}
function renderTenantOptions() {
  const sel = $('#tenant');
  const val = S.tenant === null ? '*' : S.tenant;
  sel.innerHTML = `<option value="*">All tenants</option><option value="">(platform default)</option>` +

}
function render() {
  renderNav();
  const v = {
    dashboard: viewDashboard, profiles: viewProfiles, batches: viewBatches, upp: viewUPP, perso: viewPerso,
    pool: viewPool, eids: viewEids, notifs: viewNotifs, audit: viewAudit, events: viewEvents, tenants: viewTenants,
  }[S.section];

async function connect() {
  S.base = $('#base').value.trim() || S.base;
  S.mode = $('#mode').value;
  localStorage.setItem('rsp42.base', S.base);
  localStorage.setItem('rsp42.mode', S.mode);
  setStatus('connecting…');
  banner('');
  S.connected = false; S.specServed = false;
  try {
    S.transport = S.mode === 'demo' ? makeDemoTransport() : makeFetchTransport(S.base);
    S.kind = S.transport.kind;
    // Probe: the SM-DS listener serves only /openapi.json and /events, the
    // SM-DP+ listener serves the whole management API. Either answers openapi.
    try {
      await apiGet('/openapi.json');
      S.specServed = true;
    } catch (e) {
      if (S.mode === 'api') await apiGet('/profiles', { size: 1 });
    }
    S.connected = true;
    $('#clientKind').textContent = S.kind + (S.specServed ? ' · openapi' : '');
    $('#specLink').href = S.mode === 'demo' ? '#' : S.base.replace(/\/+$/, '') + '/openapi.json';
    setStatus('connected · ' + S.kind, 'ok');
    await loadTenants().catch(() => {});
    renderTenantOptions();
    await refresh();
  } catch (e) {
    S.connected = false;
    setStatus('offline', 'bad');
    banner(esc(e.message) + ' — check that the admin listener is running and, for a browser origin, that CORS is enabled ' +
      '(<span class="mono">smdpp.server.cors.allowed_origins</span>). Switch the data source to <b>Demo data</b> to explore the UI.', 'err');
    render();
    toast('Connect failed', e.message, 'err');
  }
}

async function run(state, label, fn) {
  state.loading = true; state.error = '';
  render();
  try { await fn(); }
  catch (e) { state.error = e.message; toast(label, e.message, 'err'); }
  state.loading = false;
  render();
}

async function refresh() {
  switch (S.section) {
    case 'dashboard': return loadDashboard();
    case 'profiles': return loadProfiles();
    case 'batches': return loadBatches();
    case 'upp': return loadUPP();
    case 'perso': return loadPerso();
    case 'pool': return loadPool();
    case 'eids': return loadEids();
    case 'notifs': return loadNotifs();
    case 'audit': return loadAudit();
    case 'events': return loadEvents();
    case 'tenants': return loadTenants();
  }
}

// ===================================================================== actions
function numOrNull(v) { return v === '' || v === undefined || v === null ? null : +v; }
function jsonOrThrow(id, label) {
  const raw = $(id).value.trim();
  if (!raw) return undefined;
  try { return JSON.parse(raw); } catch (e) { throw new Error(label + ': ' + e.message); }
}
function persoBody() {
  const body = {
    imsi: $('#f-pimsi').value.trim(), k: $('#f-pk').value.trim(), opc: $('#f-popc').value.trim(),
    spn: $('#f-pspn').value.trim(), algorithm: $('#f-palgo').value,
    pin1: $('#f-ppin').value.trim(), puk1: $('#f-ppuk').value.trim(),
    adm1: $('#f-padm1').value.trim(), adm2: $('#f-padm2').value.trim(),
    msisdn: $('#f-pmsisdn').value.trim(), acc: numOrNull($('#f-pacc').value),
    numberOfKeccak: numOrNull($('#f-pkeccak').value),
    rotation: $('#f-prot').value.trim(), xoring: $('#f-pxor').value.trim(),
  };
  const plmn = jsonOrThrow('#f-pplmn', 'PLMN'); if (plmn !== undefined) body.plmn = plmn;
  const patch = jsonOrThrow('#f-ppatch', 'filePatches'); if (patch !== undefined) body.filePatches = patch;
  return body;
}

async function doAction(action, el) {
  const d = el.dataset;
  try {
    // navigation-free reloads
    if (action === 'dashboard-reload') return loadDashboard();
    if (action === 'profiles-reload') return loadProfiles();
    if (action === 'perso-reload') return loadPerso();
    if (action === 'pool-reload') return loadPool();
    if (action === 'eids-reload') return loadEids();
    if (action === 'notifs-reload') return loadNotifs();
    if (action === 'audit-reload') return loadAudit();
    if (action === 'events-reload') return loadEvents();
    if (action === 'modal-close') return closeModal();
    if (action === 'drawer-close') return closeDrawer();

    // ---- profiles
    if (action === 'profiles-advanced') return modalAdvancedProfileFilters();
    if (action === 'profile-new') return modalNewProfile();
    if (action === 'profile-open') return openProfile(d.iccid);
    if (action === 'profile-edit') { const p = await apiGet('/profiles/' + encodeURIComponent(d.iccid)); return modalEditProfile(p); }
    if (action === 'profile-confirm') { await apiWrite('POST', `/profiles/${encodeURIComponent(d.iccid)}/confirm`, { release: true }); toast('Confirmed', d.iccid, 'ok'); closeDrawer(); return loadProfiles(); }
    if (action === 'profile-cancel') { await apiWrite('POST', `/profiles/${encodeURIComponent(d.iccid)}/cancel`, { finalStatus: 'Available' }); toast('Cancelled', d.iccid, 'ok'); return loadProfiles(); }
    if (action === 'profile-release') { await apiWrite('POST', `/profiles/${encodeURIComponent(d.iccid)}/release`); toast('Released', d.iccid, 'ok'); closeDrawer(); return loadProfiles(); }
    if (action === 'profile-delete') {
      if (!confirm(`Delete ${d.iccid}? The ICCID returns to the pool.`)) return;
      await apiWrite('DELETE', `/profiles/${encodeURIComponent(d.iccid)}`);
      toast('Deleted', d.iccid, 'ok'); closeDrawer(); return loadProfiles();
    }
    if (action === 'profile-ac') {
      const r = await apiWrite('POST', `/profiles/${encodeURIComponent(d.iccid)}/activation-code`, undefined, { params: d.rotate === '1' ? { rotate: '1' } : {} });
      showModal('Activation code', `<dl class="kv"><dt>ICCID</dt><dd>${esc(d.iccid)}</dd><dt>Matching ID</dt><dd>${esc(r.matchingId)}</dd>
        <dt>Activation code</dt><dd>${esc(r.activationCode)}</dd><dt>QR content</dt><dd>${esc(r.qrContent)}</dd></dl>
        <p style="color:var(--muted);font-size:12.5px">Pass <span class="mono">?rotate=1</span> to rotate the matching id (previously issued QR codes stop working).</p>`,
        `<button class="btn primary" data-action="modal-close">Close</button>`);
      return;
    }
    if (action === 'profiles-export') { await exportDownload('/profiles/export', d.format, 'profiles', profilesQuery()); return; }
    if (action === 'profiles-import') return modalImportProfiles();
    if (action === 'profiles-bulk') {
      const iccids = [...S.profiles.selected];
      if (!iccids.length) return;
      if (d.mode === 'delete' && !confirm(`Delete ${iccids.length} profiles?`)) return;
      const r = await apiWrite('POST', '/profiles/bulk', { action: d.mode, iccids, release: d.mode === 'confirm', finalStatus: 'Available' });
      const failed = (r.results || []).filter(x => !x.ok).length;
      toast('Bulk ' + d.mode, `${iccids.length - failed} ok, ${failed} failed`, failed ? 'err' : 'ok');
      S.profiles.selected.clear();
      return loadProfiles();
    }
    if (action === 'profiles-clear') { S.profiles.selected.clear(); return render(); }
    if (action === 'submit-profile') {
      const body = {
        iccid: $('#f-iccid').value.trim() || undefined, eid: $('#f-eid').value.trim() || undefined,
        profileType: $('#f-type').value, matchingId: $('#f-mid').value.trim() || undefined,
        uppTemplate: $('#f-upp').value.trim() || undefined, externalRef: $('#f-ref').value.trim() || undefined,
        smdsAddress: $('#f-smds').value.trim() || undefined,
      };
      const created = await apiWrite('POST', '/profiles', body, { idem: newKey() });
      closeModal(); toast('Profile created', created.iccid, 'ok'); return loadProfiles();
    }
    if (action === 'submit-profile-edit') {
      const ppr = $('#f-ppr').value.trim();
      const body = { eid: $('#f-eid').value.trim(), externalRef: $('#f-ref').value.trim(), matchingId: $('#f-mid').value.trim(),
        uppTemplate: $('#f-upp').value.trim(), smdsAddress: $('#f-smds').value.trim(), tenant: $('#f-tenant').value.trim() };
      if (ppr) body.pprIds = ppr.split(',').map(s => +s.trim()).filter(n => Number.isFinite(n));
      await apiWrite('PATCH', `/profiles/${encodeURIComponent(d.iccid)}`, body);
      closeModal(); closeDrawer(); toast('Profile updated', d.iccid, 'ok'); return loadProfiles();
    }
    if (action === 'submit-profile-import') {
      const file = $('#f-file').files[0];
      const text = file ? await file.text() : $('#f-text').value.trim();
      if (!text) return toast('Import', 'provide a file or JSON/CSV text', 'err');
      const isCsv = (file && /\.csv$/i.test(file.name)) || (!text.startsWith('{') && !text.startsWith('['));
      const r = await apiWrite('POST', '/profiles/import', isCsv ? text : JSON.parse(text), { idem: newKey(), contentType: isCsv ? 'text/csv' : 'application/json' });
      closeModal(); toast('Imported', `${r.imported} ok of ${(r.results || []).length}`, 'ok'); return loadProfiles();
    }

    // ---- batches
    if (action === 'batch-new') return modalNewBatch();
    if (action === 'batch-open') {
      const [detail, items] = await Promise.all([
        apiGet(`/batches/${d.id}`),
        apiGet(`/batches/${d.id}/items`, { size: 200 }),
      ]);
      const b = detail.batch || {};
      showDrawer(`Batch #${b.id} · ${esc(b.name || '')}`, `
        <dl class="kv"><dt>State</dt><dd>${badge(b.state)}</dd><dt>Profile type</dt><dd>${esc(b.profileType || '–')}</dd>
          <dt>Total</dt><dd>${b.total}</dd><dt>Note</dt><dd>${esc(b.note || '–')}</dd>
          <dt>Created</dt><dd>${fmtTime(b.createdAt)}</dd></dl>
        <h4 class="sec">State breakdown</h4>${bars(Object.entries(detail.states || {}).map(([key, count]) => ({ key, count })))}
        <h4 class="sec">Items (${items.total})</h4>
        ${itemsTable(items.items || [])}`);
      return;
    }
    if (action === 'batch-confirm') { const r = await apiWrite('POST', `/batches/${d.id}/confirm`, { release: true }); toast('Batch confirmed', `applied ${r.applied}, failed ${r.failed}`, 'ok'); closeDrawer(); return loadBatches(); }
    if (action === 'batch-cancel') { const r = await apiWrite('POST', `/batches/${d.id}/cancel`, { finalStatus: 'Available' }); toast('Batch cancelled', `applied ${r.applied}, failed ${r.failed}`, 'ok'); closeDrawer(); return loadBatches(); }
    if (action === 'batch-delete') { if (!confirm(`Delete batch #${d.id}?`)) return; await apiWrite('DELETE', `/batches/${d.id}`); toast('Deleted', 'batch #' + d.id, 'ok'); return loadBatches(); }
    if (action === 'submit-batch') {
      await apiWrite('POST', '/batches', { name: $('#f-bname').value, count: +$('#f-bcount').value, profileType: $('#f-btype').value,
        eid: $('#f-beid').value.trim(), uppTemplate: $('#f-bupp').value.trim(), note: $('#f-bnote').value.trim() }, { idem: newKey() });
      closeModal(); toast('Batch created', '', 'ok'); return loadBatches();
    }

    // ---- upp
    if (action === 'upp-upload') return modalUploadUPP();
    if (action === 'upp-render') return modalRenderUPP();
    if (action === 'upp-decoded') { const r = await apiGet(`/upp/${encodeURIComponent(d.name)}/decoded`, { tenant: d.tenant ?? undefined }); showModal(`Decoded · ${esc(d.name)}`, decodedView(r), `<button class="btn primary" data-action="modal-close">Close</button>`); return; }
    if (action === 'upp-schema') {
      const r = await apiGet(`/upp/${encodeURIComponent(d.name)}/schema`, { tenant: d.tenant ?? undefined });
      showModal(`Schema · ${esc(d.name)}`, `${inspectView(r.inspection)}
        <h4 class="sec">Personalization fields</h4>
        <table><thead><tr><th>Field</th><th>Type</th><th>Required</th><th>Constraints</th><th>Description</th></tr></thead><tbody>
        ${(r.fields || []).map(f => `<tr><td class="mono">${esc(f.name)}</td><td>${esc(f.type)}</td><td>${f.required ? 'yes' : 'no'}</td>
          <td class="mono">${esc([f.pattern && 'pattern ' + f.pattern, f.minLength != null && 'min ' + f.minLength, f.maxLength != null && 'max ' + f.maxLength,
            (f.enum || []).length ? 'enum ' + f.enum.join('|') : ''].filter(Boolean).join('; '))}</td>
          <td>${esc(f.description || '')}</td></tr>`).join('')}</tbody></table>`,
        `<button class="btn primary" data-action="modal-close">Close</button>`);
      return;
    }
    if (action === 'upp-versions') {
      const r = await apiGet(`/upp/${encodeURIComponent(d.name)}/versions`, { tenant: d.tenant ?? undefined });
      showModal(`Versions · ${esc(d.name)}`, (r.items || []).length ? `<table><thead><tr><th>ID</th><th>Version</th><th>SAIP</th><th>SHA-256</th><th>Size</th><th>Note</th><th>Created</th><th></th></tr></thead><tbody>
        ${r.items.map(v => `<tr><td>#${v.id}</td><td>${v.versionNo}</td><td>${esc(v.saip)}</td><td class="mono">${esc(short(v.sha256, 14))}</td>
          <td>${v.size}</td><td>${esc(v.note || '–')}</td><td>${fmtTime(v.createdAt)}</td>
          <td><div class="actions"><button class="btn sm" data-action="upp-restore" data-name="${attr(d.name)}" data-tenant="${attr(d.tenant || '')}" data-version="${v.id}">Restore</button></div></td></tr>`).join('')}
        </tbody></table>` : empty('No archived revisions.'),
        `<button class="btn primary" data-action="modal-close">Close</button>`);
      return;
    }
    if (action === 'upp-restore') { await apiWrite('POST', `/upp/${encodeURIComponent(d.name)}/versions/${d.version}/restore`, undefined, { params: { tenant: d.tenant || undefined } }); closeModal(); toast('Restored', d.name + ' ← version ' + d.version, 'ok'); return loadUPP(); }
    if (action === 'upp-bytes') { const blob = await S.transport.download(`/upp/${encodeURIComponent(d.name)}/bytes`, { tenant: d.tenant ?? undefined }); saveBlob(blob, d.name.replace(/[^\w.-]+/g, '_')); return; }
    if (action === 'upp-toggle') { await apiWrite('POST', `/upp/${encodeURIComponent(d.name)}/${d.on === '1' ? 'activate' : 'deactivate'}`, undefined, { params: { tenant: d.tenant || undefined } }); return loadUPP(); }
    if (action === 'upp-delete') { if (!confirm(`Delete template ${d.name}?`)) return; await apiWrite('DELETE', `/upp/${encodeURIComponent(d.name)}`, undefined, { params: { tenant: d.tenant || undefined } }); toast('Deleted', d.name, 'ok'); return loadUPP(); }
    if (action === 'upp-clone') return modalCloneUPP(d.name);
    if (action === 'submit-upp-clone') {
      await apiWrite('POST', `/upp/${encodeURIComponent(d.name)}/clone`, { tenant: $('#f-ctenant').value.trim(), name: $('#f-cname').value.trim() || undefined });
      closeModal(); toast('Cloned', d.name, 'ok'); return loadUPP();
    }
    if (action === 'upp-promote') {
      if (!confirm(`Promote ${d.name} from ${d.tenant} to the global scope?`)) return;
      await apiWrite('POST', `/upp/${encodeURIComponent(d.name)}/promote`, undefined, { params: { tenant: d.tenant } });
      toast('Promoted', d.name + ' → global', 'ok'); return loadUPP();
    }
    if (action === 'validate-upp') {
      const file = $('#f-file').files[0];
      if (!file) return toast('Validate', 'choose a file', 'err');
      const r = await apiWrite('POST', '/upp/validate', { name: $('#f-uname').value.trim(), data: await fileToBase64(file) });
      $('#upp-val').innerHTML = r.valid ? `<h4 class="sec">Valid</h4>${inspectView(r.inspection)}` : `<h4 class="sec" style="color:var(--red)">Invalid</h4><p>${esc(r.error)}</p>`;
      return;
    }
    if (action === 'submit-upp') {
      const file = $('#f-file').files[0];
      if (!file) return toast('Upload', 'choose a file', 'err');
      const t = await apiWrite('POST', '/upp', { name: $('#f-uname').value.trim() || file.name, tenant: $('#f-utenant').value.trim() || undefined, data: await fileToBase64(file) });
      closeModal(); toast('Template stored', t.name, 'ok'); return loadUPP();
    }
    if (action === 'submit-upp-render') {
      let perso = {};
      try { perso = JSON.parse($('#f-rjson').value || '{}'); } catch (e) { return toast('Render', 'invalid JSON: ' + e.message, 'err'); }
      const r = await apiWrite('POST', '/upp/render', Object.assign({ name: $('#f-rname').value.trim() }, perso));
      $('#upp-val').innerHTML = r.rendered
        ? `<h4 class="sec">Rendered · ${r.bytes} bytes</h4>${inspectView(r.inspection)}`
        : `<h4 class="sec" style="color:var(--red)">Not rendered</h4><p>${esc(r.error)}</p>`;
      return;
    }

    // ---- personalization
    if (action === 'perso-new') return modalPerso('');
    if (action === 'perso-open' || action === 'perso-edit') return modalPerso(d.iccid);
    if (action === 'perso-delete') { if (!confirm(`Delete personalization for ${d.iccid}?`)) return; await apiWrite('DELETE', `/personalization/${encodeURIComponent(d.iccid)}`); toast('Deleted', d.iccid, 'ok'); return loadPerso(); }
    if (action === 'perso-import') return modalPersoImport();
    if (action === 'perso-pool-import') return modalPersoPoolImport();
    if (action === 'perso-export') { await exportDownload('/personalization/export', d.format, 'personalization', { iccid: S.perso.iccid || undefined }); return; }
    if (action === 'submit-perso') {
      const iccid = $('#f-piccid').value.trim();
      if (!iccid) return toast('Save', 'ICCID is required', 'err');
      await apiWrite('PUT', '/personalization/' + encodeURIComponent(iccid), persoBody());
      closeModal(); toast('Saved', iccid, 'ok'); return loadPerso();
    }
    if (action === 'submit-perso-pool') {
      let records; try { records = JSON.parse($('#f-pooljson').value); } catch (e) { return toast('Import pool', 'invalid JSON: ' + e.message, 'err'); }
      const r = await apiWrite('POST', '/personalization/pool/import', { records });
      closeModal(); toast('Credentials imported', `${r.imported} of ${(r.results || []).length}`, 'ok'); return loadPerso();
    }
    if (action === 'submit-perso-import') {
      let records; try { records = JSON.parse($('#f-persojson').value); } catch (e) { return toast('Import', 'invalid JSON: ' + e.message, 'err'); }
      const r = await apiWrite('POST', '/personalization/import', { records });
      closeModal(); toast('Imported', String(r.imported), 'ok'); return loadPerso();
    }

    // ---- pool / ranges
    if (action === 'pool-reserve') return modalReserve();
    if (action === 'submit-reserve') {
      const r = await apiWrite('POST', '/iccid-pool/reserve', { eid: $('#f-seid').value.trim(), tenant: $('#f-stenant').value.trim(),
        reference: $('#f-sref').value.trim(), ttlSeconds: +$('#f-sttl').value || 0 });
      closeModal(); toast('Reserved', r.iccid + (r.imsi ? ' · imsi ' + r.imsi : ''), 'ok'); return loadPool();
    }
    if (action === 'pool-release') { await apiWrite('POST', '/iccid-pool/release', { iccid: d.iccid }); return loadPool(); }
    if (action === 'pool-block') { await apiWrite('POST', '/iccid-pool/block', { iccid: d.iccid, note: 'blocked from the console' }); return loadPool(); }
    if (action === 'range-new') return modalRange();
    if (action === 'range-delete') { if (!confirm(`Delete range #${d.id}?`)) return; const r = await apiWrite('DELETE', `/iccid-ranges/${d.id}`); toast('Range deleted', `${r.removed ?? 0} ICCIDs removed`, 'ok'); return loadPool(); }
    if (action === 'submit-range') {
      const r = await apiWrite('POST', '/iccid-ranges', { start: $('#f-rstart').value.trim(), end: $('#f-rend').value.trim(), note: $('#f-rnote').value.trim() });
      closeModal(); toast('Range imported', `${r.inserted} inserted, ${r.skipped} skipped`, 'ok'); return loadPool();
    }

    // ---- tenants
    if (action === 'tenant-new') return modalTenant(null);
    if (action === 'tenant-edit') { const t = await apiGet('/tenants/' + encodeURIComponent(d.id)); return modalTenant(t); }
    if (action === 'tenant-delete') { if (!confirm(`Delete tenant ${d.id}?`)) return; await apiWrite('DELETE', '/tenants/' + encodeURIComponent(d.id)); toast('Deleted', d.id, 'ok'); return loadTenants(); }
    if (action === 'submit-tenant') {
      const body = { id: $('#f-tid').value.trim(), name: $('#f-tname').value.trim(), status: $('#f-tstatus').value,
        templateQuota: numOrNull($('#f-tquota').value), profileQuota: numOrNull($('#f-tpquota').value),
        defaultUpp: $('#f-tupp').value.trim(), callbackUrl: $('#f-tcb').value.trim() };
      if (!body.id) return toast('Tenant', 'id is required', 'err');
      await apiWrite(d.id ? 'PATCH' : 'POST', d.id ? '/tenants/' + encodeURIComponent(d.id) : '/tenants', body);
      closeModal(); toast('Tenant saved', body.id, 'ok'); return loadTenants();
    }

    // ---- audit / eids
    if (action === 'audit-detail') { const x = S.audit.items[+d.idx]; showDrawer('Audit entry', `<dl class="kv">
      <dt>Time</dt><dd>${fmtTime(x.time)}</dd><dt>Tenant</dt><dd>${esc(x.tenant || '(default)')}</dd><dt>Actor</dt><dd>${esc(x.actor || '–')}</dd>
      <dt>Interface</dt><dd>${esc(x.interface || '–')}</dd><dt>Function</dt><dd>${esc(x.function || '–')}</dd><dt>Subject</dt><dd>${esc(x.subject || '–')}</dd>
      <dt>Outcome</dt><dd>${esc(x.outcome || '–')}</dd><dt>Status code</dt><dd>${esc(x.statusCode || '–')}</dd><dt>Remote</dt><dd>${esc(x.remoteAddr || '–')}</dd></dl>
      <h4 class="sec">Detail</h4><pre class="json">${esc(JSON.stringify(x.detail ?? {}, null, 2))}</pre>`); return; }
    if (action === 'eids-filter') { S.profiles.eid = d.eid; S.profiles.page = 1; S.section = 'profiles'; render(); return loadProfiles(); }
  } catch (e) { toast('Action failed', e.message, 'err'); }
}

function itemsTable(items) {
  if (!items.length) return empty('No items.', '📇');
  return `<table><thead><tr><th>ICCID</th><th>State</th><th>EID</th><th>Matching ID</th></tr></thead><tbody>${items.map(x =>
    `<tr><td class="mono">${esc(x.iccid)}</td><td>${badge(x.state)}</td><td class="mono">${esc(short(x.eid, 16) || '–')}</td><td>${esc(x.matchingId || '–')}</td></tr>`).join('')}</tbody></table>`;
}
async function exportDownload(path, format, name, extra) {
  const params = Object.assign({ format: format || 'csv' }, extra || {});
  const blob = await S.transport.download(path, Object.assign({}, tenantParams(), params));
  saveBlob(blob, `${name}.${format || 'csv'}`);
  toast('Export ready', `${name}.${format || 'csv'}`, 'ok');
}
function modalAdvancedProfileFilters() {
  const p = S.profiles;
  showModal('Profile filters', `
    <div class="two">${field('EID (substring)', `<input id="a-eid" class="input mono" value="${attr(p.eid)}" />`)}
      ${field('ICCID (prefix)', `<input id="a-iccid" class="input mono" value="${attr(p.iccid)}" />`)}</div>
    <div class="two">${field('External ref (substring)', `<input id="a-ref" class="input" value="${attr(p.externalRef)}" />`)}
      ${field('Batch id', `<input id="a-batch" class="input" type="number" value="${attr(p.batchId)}" />`)}</div>
    <div class="two">${field('Created from', `<input id="a-from" class="input" type="date" value="${attr(p.from)}" />`)}
      ${field('Created to', `<input id="a-to" class="input" type="date" value="${attr(p.to)}" />`)}</div>
    <p style="color:var(--muted);font-size:12.5px">Filters map onto the documented query parameters of <span class="mono">GET /profiles</span>.</p>`,
    `<button class="btn" data-action="modal-close">Cancel</button><button class="btn ghost" data-action="advanced-clear">Clear</button>
     <button class="btn primary" data-action="advanced-apply">Apply</button>`);
}
function fileToBase64(file) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(file); });
}

// ===================================================================== events
document.addEventListener('click', (e) => {
  const nav = e.target.closest('[data-section]');
  if (nav) { S.section = nav.dataset.section; render(); refresh(); return; }
  const pagerEl = e.target.closest('[data-pager]');
  if (pagerEl) {
    const st = S[S.section] || {};
    if (pagerEl.dataset.pager === 'prev' && st.page > 1) st.page--;
    if (pagerEl.dataset.pager === 'next') st.page++;
    refresh();
    return;
  }
  const act = e.target.closest('[data-action]');
  if (act) {
    if (act.dataset.action === 'advanced-clear') {
      Object.assign(S.profiles, { eid: '', iccid: '', externalRef: '', batchId: '', from: '', to: '', page: 1 });
      closeModal(); return loadProfiles();
    }
    if (act.dataset.action === 'advanced-apply') {
      Object.assign(S.profiles, {
        eid: $('#a-eid').value.trim(), iccid: $('#a-iccid').value.trim(), externalRef: $('#a-ref').value.trim(),
        batchId: $('#a-batch').value.trim(), from: $('#a-from').value, to: $('#a-to').value, page: 1,
      });
      closeModal(); return loadProfiles();
    }
    doAction(act.dataset.action, act);
    return;
  }
  if (e.target === $('#overlay')) { closeModal(); closeDrawer(); }
});
document.addEventListener('input', (e) => {
  const i = e.target.dataset.input;
  if (!i) return;
  const reload = debounce(() => { S[S.section].page = 1; refresh(); }, 320);
  if (i === 'profiles-q') { S.profiles.q = e.target.value; reload(); }
  if (i === 'profiles-select') {
    if (e.target.checked) S.profiles.selected.add(e.target.dataset.iccid);
    else S.profiles.selected.delete(e.target.dataset.iccid);
    render();
  }
  if (i === 'profiles-select-all') {
    if (e.target.checked) for (const x of S.profiles.items) S.profiles.selected.add(x.iccid);
    else S.profiles.selected.clear();
    render();
  }
  if (i === 'perso-iccid') { S.perso.iccid = e.target.value; reload(); }
  if (i === 'pool-iccid') { S.pool.iccid = e.target.value; reload(); }
  if (i === 'notifs-iccid') { S.notifs.iccid = e.target.value; reload(); }
  if (i === 'notifs-eid') { S.notifs.eid = e.target.value; reload(); }
  if (i === 'audit-function') { S.audit.function = e.target.value; reload(); }
  if (i === 'audit-subject') { S.audit.subject = e.target.value; reload(); }
  if (i === 'audit-actor') { S.audit.actor = e.target.value; reload(); }
  if (i === 'events-eid') { S.events.eid = e.target.value; reload(); }
  if (i === 'events-eventid') { S.events.eventId = e.target.value; reload(); }
  if (i === 'events-iccid') { S.events.iccid = e.target.value; reload(); }
  if (i === 'events-matchingid') { S.events.matchingId = e.target.value; reload(); }
});
document.addEventListener('change', (e) => {
  const i = e.target.dataset.input;
  if (!i) return;
  if (i === 'profiles-state') { S.profiles.state = e.target.value; S.profiles.page = 1; return refresh(); }
  if (i === 'profiles-sort') { S.profiles.sort = e.target.value; S.profiles.page = 1; return refresh(); }
  if (i === 'perso-reveal') { S.perso.reveal = e.target.checked; S.perso.page = 1; return refresh(); }
  if (i === 'pool-state') { S.pool.state = e.target.value; S.pool.page = 1; return refresh(); }
  if (i === 'eids-state') { S.eids.state = e.target.value; S.eids.page = 1; return refresh(); }
  if (i === 'audit-interface') { S.audit.interface = e.target.value; S.audit.page = 1; return refresh(); }
  if (i === 'audit-outcome') { S.audit.outcome = e.target.value; S.audit.page = 1; return refresh(); }
  if (i === 'events-status') { S.events.status = e.target.value; S.events.page = 1; return refresh(); }
  if (i === 'events-sort') { S.events.sort = e.target.value; S.events.page = 1; return refresh(); }
  const dateMap = { 'eids-from': ['eids', 'from'], 'eids-to': ['eids', 'to'], 'notifs-from': ['notifs', 'from'], 'notifs-to': ['notifs', 'to'],
    'audit-from': ['audit', 'from'], 'audit-to': ['audit', 'to'], 'events-from': ['events', 'from'], 'events-to': ['events', 'to'] };
  if (dateMap[i]) { const [st, k] = dateMap[i]; S[st][k] = e.target.value; S[st].page = 1; refresh(); }
});

// ===================================================================== boot
$('#base').value = S.base;
$('#mode').value = S.mode;
$('#connectBtn').addEventListener('click', connect);
$('#mode').addEventListener('change', connect);
$('#tenant').addEventListener('change', (e) => {
  const v = e.target.value;
  S.tenant = v === '*' ? null : v;
  localStorage.setItem('rsp42.tenant', v);
  $('#tenantScope').textContent = S.tenant === null ? 'all tenants' : (S.tenant === '' ? '(platform default)' : S.tenant);
  S.profiles.selected.clear();
  refresh();
});
render();
connect();
</script>
</body>
</html>
