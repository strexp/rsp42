# rsp42 configuration (example).
#
# Copy to config/config.yaml and adjust. Every value can be overridden with an
# environment variable prefixed RSP42_, using underscores for nesting, e.g.
# RSP42_SMDPP_FQDN or RSP42_SMDPP_SERVER_ES9P_PORT.
#
# The SM-DP+ (`smdpp`) and SM-DS (`smds`) are peers with equal standing; neither
# is the default. Run the one you want:
#   rsp42 smdpp --config config/config.yaml
#   rsp42 smds  --config config/config.yaml
#
# Defaults use the SGP.26 v3.0.2 (2026) Variant O test certificates. Run
# scripts/extract-testdata.sh once to populate testdata/ before starting.

# ------------------------------------------------------------------ SM-DP+ ---
smdpp:
  enabled: true
  server:
    bind: "0.0.0.0"
    # Cross-origin access for browser clients (e.g. deploy/demo.html). An empty
    # list disables CORS; "*" allows any origin (test/dev only — restrict it in
    # production).
    cors:
      allowed_origins: ["*"]
    es9p:
      port: 8443
      tls:
        enabled: true
        cert_file: "testdata/sgp26/SM-DP+/DPtls/CERT_DPtls_NIST.pem"
        key_file: "testdata/sgp26/SM-DP+/DPtls/SK_DPtls_NIST.pem"
        min_version: "1.2"
    es2p:
      port: 8444
      tls:
        enabled: true
        cert_file: "testdata/sgp26/SM-DP+/DPtls/CERT_DPtls_NIST.pem"
        key_file: "testdata/sgp26/SM-DP+/DPtls/SK_DPtls_NIST.pem"
        client_ca_file: "testdata/sgp26/CertificateIssuer/CERT_CI_NIST.pem"
        min_version: "1.2"
    admin:
      port: 9000
  # ES2+ tenant resolution (docs/esim42-integration-gaps.md §8.1 decision 3):
  # the caller's header.functionRequesterIdentifier selects the tenant. An
  # unmapped requester falls back to the platform-default tenant ("").
  es2p:
    requester_tenants:
      # - requester: "carrier-a-bss"
      #   tenant: "carrier-a"
  fqdn: "testsmdpplus1.example.com"
  oid: "2.999.10"
  host_id: "0000000000000000"
  curve: "nist"
  transaction_id_len: 16
  session_ttl: "30m"
  download_ttl: "24h"
  max_download_attempts: 5
  max_cc_attempts: 3
  es12:
    enabled: true
    smds_address: "testrootsmds.example.com"
    register_on_confirm: true
    forwarding_indicator: true
    delete_on_install: true
    tls:
      client_cert_file: "testdata/sgp26/SM-DP+/DPtls/CERT_DPtls_NIST.pem"
      client_key_file: "testdata/sgp26/SM-DP+/DPtls/SK_DPtls_NIST.pem"
      ca_file: "testdata/sgp26/CertificateIssuer/CERT_CI_NIST.pem"

# ------------------------------------------------------------------- SM-DS ---
smds:
  enabled: true
  server:
    bind: "0.0.0.0"
    cors:
      allowed_origins: ["*"]
    es11:
      port: 9443
      tls:
        enabled: true
        cert_file: "testdata/sgp26/SM-DS/DStls/CERT_DStls_NIST.pem"
        key_file: "testdata/sgp26/SM-DS/DStls/SK_DStls_NIST.pem"
        min_version: "1.2"
    es12:
      port: 9444
      tls:
        enabled: true
        cert_file: "testdata/sgp26/SM-DS/DStls/CERT_DStls_NIST.pem"
        key_file: "testdata/sgp26/SM-DS/DStls/SK_DStls_NIST.pem"
        client_ca_file: "testdata/sgp26/CertificateIssuer/CERT_CI_NIST.pem"
        min_version: "1.2"
    admin:
      port: 9100
  role: "root"
  # ES12 caller-OID -> tenant mapping, used when a registration carries no
  # X-RSP42-Tenant header (the SM-DP+ normally sets that header).
  es12:
    requester_tenants:
      # - requester: "2.999.10"
      #   tenant: "carrier-a"
  fqdn: "testrootsmds.example.com"
  oid: "2.999.15"
  curve: "nist"
  event_ttl: "720h"
  dsauth:
    cert_file: "testdata/sgp26/SM-DS/DSauth/CERT_DSauth_NIST.der"
    key_file: "testdata/sgp26/SM-DS/DSauth/SK_DSauth_NIST.pem"
  dstls:
    cert_file: "testdata/sgp26/SM-DS/DStls/CERT_DStls_NIST.pem"
    key_file: "testdata/sgp26/SM-DS/DStls/SK_DStls_NIST.pem"
  cascade:
    enabled: false
    root_address: ""
    tls:
      client_cert_file: ""
      client_key_file: ""
      ca_file: ""
  store:
    dsn: "file:db/rsp42-smds.db?_pragma=journal_mode(WAL)&_pragma=busy_timeout(5000)"

# ----------------------------------------------------------- shared config ---
certs:
  root_dir: "testdata/sgp26"
  ci: "CertificateIssuer"
  eum: "EUM"
  euicc: "eUICC"
  dp_auth: "SM-DP+/DPauth"
  dp_pb: "SM-DP+/DPpb"
  dp_tls: "SM-DP+/DPtls"
  ds_auth: "SM-DS/DSauth"
  ds_tls: "SM-DS/DStls"
  allow_expired_test_certs: true
  # Additional certificate sets let one deployment serve eUICCs that propose a
  # different CI key id (SGP.26 variants). Each entry has the same shape as the
  # block above; the matching identity is selected from euiccCiPKIdToBeUsed.
  # identities:
  #   - root_dir: "testdata/sgp26-variantA"
  #     ci: "CertificateIssuer"
  #     eum: "EUM"
  #     dp_auth: "SM-DP+/DPauth"
  #     dp_pb: "SM-DP+/DPpb"

profiles:
  # Optional registry template name used when the eUICC's profile version does
  # not select one. Empty = highest active template.
  # UPP templates and per-ICCID personalization live in the database and are
  # seeded with `rsp42 admin upp import` / `rsp42 admin personalization import`.
  default_upp: ""
  # Storage backend. Only "sqlite" is supported; any other value is rejected at
  # startup. PostgreSQL and multi-replica deployments are deliberate non-goals
  # (docs/esim42-integration-gaps.md §8.4).
  repository: "sqlite"
  store:
    dsn: "file:db/rsp42-smdpp.db?_pragma=journal_mode(WAL)&_pragma=busy_timeout(5000)"
  personalization:
    default_algorithm: "milenage"
    iccid_pool_prefix: "8900012"
    imsi_pool_prefix: "00101"
    # Unclaimed ICCID pool reservations are returned to the pool after this long.
    reserve_ttl: "24h"
    # Recorded Idempotency-Key responses are replayed for this long.
    idempotency_ttl: "24h"
  # Profile Policy Rules attached to downloaded profiles (SGP.22 §2.4a).
  # 1 = PPR1 (disabling not allowed), 2 = PPR2 (deletion not allowed).
  # An order may override this via its "pprIds" field.
  ppr_ids: []

notifications:
  es2p_callback:
    # Outbound ES2+.HandleDownloadProgressInfo notifications. `enabled`/`url`
    # gate ONLY these callbacks.
    enabled: false
    url: ""
    # Operator ES2+.HandleAcrRequest endpoint (SGP.22 §5.3.8). Setting it turns
    # on the Activation Code Retrieval confirmation *independently* of
    # `enabled`/`url` above: an operator may enable ACR without progress
    # callbacks (and vice versa). When set, every ACR request — the redownload
    # (ACR-0) and the availability check (ACR-1) — is confirmed by the Operator,
    # and a refusal (8.2.1/1.2) fails the retrieval.
    acr_url: ""
    # Bounds one confirmation, the client's retries included, so an unreachable
    # Operator cannot stall the LPA's authenticateClient.
    acr_timeout: "10s"
    client_cert_file: ""
    client_key_file: ""
    ca_file: ""
    max_attempts: 5          # delivery attempts before a notification is dead-lettered
    retry_interval: "30s"    # how often pending notifications are retried

kms:
  provider: "file"
  kek_hex: "000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f"  # test-only KEK

log:
  level: "info"
  format: "json"

audit:
  enabled: true
  sink: "db"
  file: "audit.log"
