name: ci

on:
  push:
    branches: [main, master]
  pull_request:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # - name: Fetch test data
      #   run: make testdata

      - name: Build
        run: make build

      - name: Vet
        run: make vet

      - name: Test
        run: make test

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: Package artifact (binary + example config)
        run: |
          mkdir -p dist
          cp bin/rsp42 dist/rsp42
          cp config/config.example.yaml dist/config.example.yaml
          tar -C dist -czf rsp42_linux_amd64.tar.gz rsp42 config.example.yaml

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: rsp42-linux-amd64
          path: rsp42_linux_amd64.tar.gz

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image (latest)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.IMAGE }}:latest
