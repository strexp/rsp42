name: release

on:
  push:
    tags: ["v*"]

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # - name: Fetch test data
      #   run: make testdata

      - name: Build, vet and test
        run: |
          make build
          make vet
          make test

      - name: Package artifact (binary + example config)
        run: |
          mkdir -p dist
          cp bin/rsp42 dist/rsp42
          cp config/config.example.yaml dist/config.example.yaml
          tar -C dist -czf rsp42_linux_amd64.tar.gz rsp42 config.example.yaml

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: rsp42-linux-amd64
          path: rsp42_linux_amd64.tar.gz

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image (tag)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          name: ${{ github.ref_name }}
          files: rsp42_linux_amd64.tar.gz
